apply plugin: 'com.android.application'

// W5 (Dropbox sync): the App Key lives in secrets.properties, gitignored and
// never committed (see wrapper-plan.md and the author's ruling 2026-07-30).
// Missing file -> empty string, not a build failure, so a fresh checkout still
// builds -- it just can't reach Dropbox until the file is dropped in by hand.
def secretsFile = rootProject.file("secrets.properties")
def secrets = new Properties()
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
}

// W7 item 3 (packaging): the release signing key, same gitignored-properties
// pattern as above and for the same reason -- an APK other people install has
// to be signed with a stable, private key, and Android identifies the app by
// that certificate forever after. Missing file -> no release signingConfig at
// all rather than a broken one, so `assembleDebug` and a fresh checkout still
// work untouched; only `assembleRelease` needs it, and tools_package.py checks
// for it up front rather than letting Gradle fail deep in a task graph.
def keystoreFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKeystore = keystoreProps.containsKey('storeFile') &&
    rootProject.file(keystoreProps.getProperty('storeFile')).exists()

android {
    namespace = "com.ianhruday.oela"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.ianhruday.oela"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "DROPBOX_APP_KEY", "\"${secrets.getProperty('dropboxAppKey', '')}\""
        // AppAuth's own manifest (merged in from the net.openid:appauth AAR)
        // declares RedirectUriReceiverActivity with a <data android:scheme=...>
        // filled from this placeholder -- no activity to hand-declare here.
        // Scheme only: "com.ianhruday.oela://oauth2redirect" is the scheme
        // (com.ianhruday.oela) plus a host segment (oauth2redirect) the code
        // constructs when building the redirect Uri; the filter matches on
        // scheme, so the host portion doesn't need its own manifest entry.
        manifestPlaceholders = [ appAuthRedirectScheme: "com.ianhruday.oela" ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            // minifyEnabled stays false, deliberately. R8 would shrink an
            // already-small APK (the payload is one 1.3 MB HTML file that
            // ProGuard cannot touch anyway) while adding a class of
            // release-only breakage -- AppAuth and Capacitor both resolve
            // plugin classes reflectively -- to a build nobody can debug
            // remotely once it is on a friend's phone.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // W5: OAuth through the system browser (wrapper-plan.md §1 -- "available
    // because the wrapper owns its auth flow"), PKCE, no app secret involved.
    implementation "net.openid:appauth:0.11.1"
    // Refresh token storage -- Keystore-backed, deliberately NOT the gtd_
    // Preferences/Filesystem mirror W2 built for app data. A sync credential
    // is not app data and Reset must not be the thing that revokes it.
    implementation "androidx.security:security-crypto:1.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
