.review-form-input.field-invalid{ outline:1.5px dashed var(--red); outline-offset:2px; }
/* Two rows, stacked: Cancel/Add (controls over the quick-add field itself —
   keep or go back) on top, Open drafting page (a different kind of control —
   more options for this action) below, spanning both. Author ruling: the two
   groups answer different questions, so they get different rows, but Open
   drafting page does not need a different color to read as separate — the
   position already says that. */
.review-inline-form-btns{ display:flex; flex-direction:column; gap:8px; }
.review-inline-form-btns-row{ display:flex; gap:8px; }
.review-inline-form-btns-row .review-menu-btn{ flex:1 1 0; text-align:center; }
/* Add is the unmistakable primary action (author ruling): filled, on the
   right. Cancel sits to its left, under the quick-add field. */
.review-inline-form-btns-row .review-menu-btn.review-form-primary{
  background:var(--brass); color:var(--dark-on-accent); border-color:transparent; font-weight:600; }
.review-inline-form-btns-row .review-menu-btn.review-form-primary:hover{ filter:brightness(1.08); }
.review-inline-form-btns .review-menu-btn.review-form-full{ text-align:center; width:100%; }
/* Redaction: visible-but-sealed. You can see one more loop exists and count
   them; you cannot read or tap it (§4.8b). */
.review-redaction{ height:56px; border-radius:10px; border:1px solid rgba(255,255,255,0.08);
  background:#000; pointer-events:none; }
.review-info-panel{ font-size:12.5px; color:var(--text-soft); background:rgba(255,255,255,0.05); border-radius:8px; padding:11px 13px; line-height:1.5; display:flex; flex-direction:column; gap:10px; }
.review-info-panel[hidden]{ display:none; } /* the attribute must win over display:flex */
.review-info-block b{ color:var(--text-primary); }
.review-end{ text-align:center; padding:48px 16px; display:flex; flex-direction:column; gap:8px; }
.review-end-big{ font-family:var(--font-display); font-weight:700; font-size:22px; color:var(--text-primary); }
.review-end-sub{ font-size:13.5px; color:var(--text-soft); line-height:1.5; }

/* ----------------------------------------------------------------------------
   ▲ POST-SPRINT (§P6) — THE HABIT RUNNER, AS CHALK ON A CHALKBOARD
   The module ships black-on-cream and exposes four colour variables, so the
   whole restyle is a palette swap plus the board it is drawn on — the artwork
   is untouched. Slate green rather than black: a true-black board on a
   near-black desk loses its edge entirely.
---------------------------------------------------------------------------- */
.habit-runner-host{
  display:flex; justify-content:center;
  padding:14px 10px 10px;
  margin-bottom:12px;
  border-radius:10px;
  background-color:#1E2A26;
  background-image:var(--chalk-dust);
  background-size:var(--chalk-dust-size) var(--chalk-dust-size);
  background-repeat:repeat;
  border:1px solid rgba(0,0,0,0.5);
  /* A chalkboard is recessed in its frame, not raised off the desk. */
  box-shadow:inset 0 2px 10px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.04);
}
.habit-runner-host .runner-box{
  --runner-ink:#EFEADC;                    /* chalk */
  --runner-ghost:rgba(239,234,220,0.30);   /* a half-erased earlier drawing */
  --runner-bubble-bg:transparent;          /* chalk outlines the bubble, it doesn't fill it */
  --runner-ground:rgba(239,234,220,0.42);
}
/* Chalk is powder on a rough surface, so its edge is never crisp. A small
   blur-free glow does more than any drop shadow here. */
.habit-runner-host .runner-stage{ filter:drop-shadow(0 0 0.6px rgba(239,234,220,0.55)); }
.habit-runner-host .runner-bubble{
  font-family:var(--font-body);
  font-size:13px;
  text-shadow:0 0 1px rgba(239,234,220,0.4);
}

/* ▲ POST-SPRINT (§P1) — settings as a dropdown under the header ⋯, replacing
   the modal sheet. Same visual idiom as the notes filter menu, anchored to the
   header's right edge. The scrim is invisible but catches the outside tap. */
.menu-scrim{ position:fixed; inset:0; z-index:130; background:transparent; }
.settings-menu{
  position:fixed; z-index:131;
  top:calc(var(--header-h) + env(safe-area-inset-top) - 6px);
  right:calc(14px + env(safe-area-inset-right));
  min-width:238px; max-width:min(300px, 86vw);
  background:var(--paper); border:1px solid rgba(255,255,255,0.16); border-radius:10px;
  box-shadow:var(--paper-shadow); padding:5px; display:flex; flex-direction:column; gap:2px;
}
.settings-item{
  display:flex; align-items:center; gap:10px; text-align:left; width:100%;
  border:none; background:transparent; color:var(--text-primary);
  border-radius:7px; padding:10px 11px; font-size:13.5px;
}
.settings-item:hover{ background:rgba(255,255,255,0.08); }
.settings-item .si-label{ flex:1; }
.settings-item .si-value{ font-family:var(--font-mono); font-size:11px; color:var(--text-soft); }
.settings-item .si-caret{ color:var(--text-soft); font-size:14px; }
.settings-item.danger{ color:var(--red); }
.settings-item.disabled{ color:var(--text-soft); cursor:default; }
.settings-item.disabled:hover{ background:transparent; }
.settings-back{ color:var(--text-soft); font-weight:600; }
.settings-sep{ height:1px; background:rgba(255,255,255,0.10); margin:4px 6px; }
.settings-check{ color:var(--brass); font-size:13px; }
.settings-swatch{
  flex:0 0 auto; width:20px; height:20px; border-radius:4px;
  border:1px solid rgba(255,255,255,0.22);
}

/* CHUNK 6 — Notes lane */
.note-card{ cursor:pointer; }
.note-preview{ font-size:12.5px; color:var(--text-soft); margin-top:3px; line-height:1.45;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
/* Rich-text note body (§4.9, user): a taller contenteditable scratchpad with
   a formatting toolbar. Extends well down the page; scrolls inside itself once
   it outgrows its min-height rather than pushing the chip row off-screen. */
.note-toolbar{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
.note-tool{ min-width:30px; height:30px; padding:0 7px; border:1px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.05); color:var(--text-primary); border-radius:6px; font-size:14px;
  line-height:1; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
.note-tool:active{ background:rgba(255,255,255,0.14); }
.note-tool-sep{ width:1px; align-self:stretch; margin:2px 3px; background:rgba(255,255,255,0.16); }
.note-body{ min-height:45vh; max-height:62vh; overflow-y:auto; resize:none; cursor:text; }
.note-body.is-empty:before{ content:attr(data-placeholder); color:var(--text-soft); pointer-events:none; }
.note-body h2{ font-family:var(--font-display); font-size:16px; font-weight:700; margin:10px 0 4px; }
.note-body ul,.note-body ol{ margin:4px 0 4px 22px; }
.note-body li{ margin:2px 0; }
/* Checklist (user): a <ul class="checklist"> whose items carry a tappable
   checkbox drawn in CSS. Ticked state is the `checked` class only. */
.note-body ul.checklist{ list-style:none; margin-left:2px; padding-left:0; }
.note-body ul.checklist > li{ position:relative; padding-left:28px; margin:4px 0; min-height:1.5em; }
.note-body ul.checklist > li:before{ content:"\2610"; position:absolute; left:0; top:-1px;
  font-size:17px; line-height:1.3; color:var(--text-soft); cursor:pointer; }
.note-body ul.checklist > li.checked:before{ content:"\2611"; color:var(--teal); }
.note-body ul.checklist > li.checked{ color:var(--text-soft); text-decoration:line-through; }
.note-body:focus{ outline:2px solid var(--lane-accent, var(--teal)); outline-offset:1px; }
.note-attached{ margin-top:10px; }
.note-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; align-items:center; }
.note-chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:4px 9px; border-radius:20px;
  border:1px solid var(--teal); color:var(--text-primary); background:rgba(79,179,166,0.14); }
.note-chip-completed{ border-color:var(--moss); background:rgba(107,158,107,0.16); }
.note-chip-deleted{ border-style:dashed; border-color:var(--red); color:var(--red); background:transparent; } /* tombstone (§4.9) */
.note-chip-more{ border-color:rgba(255,255,255,0.22); background:rgba(255,255,255,0.06); color:var(--text-soft); } /* "+n" overflow badge (user) */
/* Tag chip (§4.9b): one flat style — tags have no live/completed/deleted states.
   Distinct hue (amber) from the teal project chips so the two read apart. */
.note-chip-tag{ border-color:var(--brass); color:var(--text-primary); background:rgba(197,160,89,0.14); }

/* Tags page (§4.9b) */
.tags-proj-list{ display:flex; flex-wrap:wrap; gap:7px; }
/* Read-only (names already taken) but still legible: higher-contrast text and a
   bolder weight so the reference list reads clearly, not as greyed noise (user). */
.tags-proj-chip{ font-size:15px; font-weight:600; padding:5px 11px; border-radius:20px; border:1px solid rgba(255,255,255,0.22);
  background:rgba(255,255,255,0.06); color:var(--text-primary); }
.tags-rows{ display:flex; flex-direction:column; gap:7px; }
.tags-row-wrap{ display:flex; flex-direction:column; gap:3px; }
.tags-row{ display:flex; align-items:center; gap:8px; }
.tags-row-input{ flex:1; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.05);
  color:var(--text-primary); border-radius:8px; padding:10px 12px; font-size:15.5px; }
.tags-row-input:focus{ outline:2px solid var(--brass); outline-offset:1px; }
.tags-row-input[readonly]{ opacity:0.6; }
.tags-row-x{ border:none; background:transparent; color:var(--text-soft); font-size:19px; line-height:1; padding:2px 6px; cursor:pointer; }
.tags-row-x:hover{ color:var(--red); }
.tags-row-reason{ font-size:11.5px; color:var(--red); padding-left:2px; } /* off-screen collision explainer (§4.9b) */
.tags-add-btn{ align-self:flex-start; margin-top:10px; font-size:13px; padding:8px 12px; border-radius:8px;
  border:1px dashed rgba(255,255,255,0.3); background:transparent; color:var(--text-soft); cursor:pointer; }
.tags-createonly-hint{ font-size:12px; color:var(--text-soft); line-height:1.45; margin-top:12px; font-style:italic; }
.note-chip[data-action]{ cursor:pointer; }
.note-chip .chip-x{ border:none; background:transparent; color:inherit; font-size:15px; line-height:1; padding:0 0 0 1px; cursor:pointer; }
.note-add-link{ font-size:12px; padding:4px 10px; border-radius:20px; border:1px dashed rgba(255,255,255,0.3); background:transparent; color:var(--text-soft); }
/* Notes filter (§4.9, user): a real filter button under the header, opening a
   single-select menu of linked projects (Tags section joins it with §4.9b). */
.notes-filter-bar{ position:relative; margin-bottom:10px; }
.notes-filter-btn{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--text-soft);
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.16); border-radius:8px; padding:7px 11px; cursor:pointer; }
.notes-filter-btn.active{ color:var(--teal); border-color:rgba(79,179,166,0.5); background:rgba(79,179,166,0.1); }
.notes-filter-btn .funnel{ font-size:11px; opacity:0.8; transition:transform .15s ease; }
.notes-filter-btn.open .funnel{ transform:rotate(180deg); }
.notes-filter-active{ font-weight:600; }
.notes-filter-btn .chip-x{ border:none; background:transparent; color:inherit; font-size:15px; line-height:1; cursor:pointer; padding:0 0 0 2px; }
.notes-filter-menu{ position:absolute; top:100%; left:0; margin-top:5px; z-index:20; min-width:190px; max-width:min(280px,80vw);
  max-height:52vh; overflow-y:auto; background:var(--paper); border:1px solid rgba(255,255,255,0.16); border-radius:9px;
  box-shadow:var(--paper-shadow); padding:5px; display:flex; flex-direction:column; gap:2px; }
.notes-filter-item{ text-align:left; border:none; background:transparent; color:var(--text-primary); border-radius:6px;
  padding:9px 10px; font-size:13px; cursor:pointer; }
.notes-filter-item:hover{ background:rgba(255,255,255,0.08); }
.notes-filter-item.current{ color:var(--teal); font-weight:600; background:rgba(79,179,166,0.12); }
.notes-filter-section{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-soft); padding:7px 10px 3px; }
.notes-filter-empty{ font-size:12px; color:var(--text-soft); padding:9px 10px; font-style:italic; line-height:1.4; }

/* ----------------------------------------------------------------------------
   CHUNK 7 — CALENDAR · EVENTS · RECURRENCE (§4.13–§4.15)
   Dark-only, like the rest of the desk. Reuses .deadline-bar for the
   pseudo-action bar (§4.14c) so nothing here restyles that.
---------------------------------------------------------------------------- */
.cal-tabs{ display:flex; gap:4px; }
.cal-tab{
  border:1px solid rgba(255,255,255,0.14); background:transparent; color:var(--text-soft);
  font-family:var(--font-body); font-weight:600; font-size:12.5px; padding:6px 14px; border-radius:8px;
}
.cal-tab.active{ background:var(--brass); border-color:var(--brass); color:var(--dark-on-accent); }
/* ▲ QA #9 — the calendar is one ordinary scrolling page: month/day area, then
   the creation section at the bottom of the content. It used to be a fixed
   column with the creation row pinned as a footer; the ruling is that scrolling
   down to the controls is preferable to them permanently occupying the view.
   So .cal-body keeps .screen-body's own scrolling and only adjusts padding —
   the bottom is trimmed because the calendar has no floating action button to
   clear, unlike the lanes. */
.cal-body{
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  /* The month grid's own arithmetic, reused so the other tabs can reserve the
     same room: .screen-body is max-width 640 with 20px side padding, .cal-cells
     is 7 columns with 3px gaps, and each cell is aspect-ratio 1/1.15. Six rows
     (the tallest a month gets) plus the weekday header row. */
  --cal-cell-w: calc((min(100vw, 640px) - 40px - 18px) / 7);
  --cal-grid-h: calc(6 * 1.15 * var(--cal-cell-w) + 15px + 20px);
}
/* ⚑ The create row used to sit immediately under whatever the day happened to
   contain, so an empty day floated it up beneath the header while Month view
   had it two-thirds down the screen — the same controls landing somewhere
   different on every tab (user). Day and List now reserve the height of a full
   month grid, so the controls sit in a stable place, and a long list just
   pushes them further down. Note the month grid is itself 5 or 6 rows deep
   depending on the month, so this matches the taller case rather than tracking
   it exactly — there is no single "where month view puts it" to hit. */
.cal-agenda, .cal-day-empty{ min-height:var(--cal-grid-h); }
.cal-day-empty{ display:flex; align-items:center; justify-content:center; }
/* ⚠ .screen-body is a flex COLUMN, so its children shrink to fit by default.
   The swipe viewport carries overflow:hidden (it has to — it clips the
   neighbouring months of the 300%-wide track), which means shrinking it does
   not produce a scrollbar, it silently CROPS the grid: the last week of the
   month simply vanished, and the page reported itself as not scrollable. Every
   direct child of the calendar body must therefore keep its natural height and
   let the body scroll. */
.cal-body > *{ flex:0 0 auto; }
/* min-height matches .cal-navbtn: List view's nav is a bare label with no
   arrows, and without this its row is shorter, so everything below it — the
   create controls included — rides 13px higher than on the other two tabs. */
.cal-monthnav, .cal-daynav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; min-height:34px; }
.cal-monthlabel{ font-family:var(--font-display); font-weight:700; font-size:16px; color:var(--text-primary); text-align:center; flex:1; }
.cal-navbtn{
  flex:0 0 auto; width:34px; height:34px; border-radius:8px; border:1px solid rgba(255,255,255,0.16);
  background:rgba(255,255,255,0.04); color:var(--text-primary); font-size:18px; line-height:1;
}
.cal-navbtn:hover{ background:rgba(255,255,255,0.1); }
.cal-swipe-viewport{ overflow:hidden; width:100%; }
.cal-swipe-track{ display:flex; width:300%; will-change:transform; }
.cal-swipe-panel{ width:33.3333%; flex:0 0 33.3333%; }
.cal-grid{ user-select:none; }
.cal-dow-row, .cal-cells{ display:grid; grid-template-columns:repeat(7, 1fr); }
.cal-dow-row{ margin-bottom:4px; }
.cal-dow{ text-align:center; font-family:var(--font-mono); font-size:10px; color:var(--text-soft); padding:2px 0; }
.cal-cells{ gap:3px; }
.cal-cell{
  position:relative; aspect-ratio:1/1.15; border:1px solid rgba(255,255,255,0.07);
  background:rgba(255,255,255,0.02); border-radius:7px; padding:4px 0 0 0;
  display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-primary);
}
.cal-cell-blank{ border:none; background:transparent; }
.cal-cell:hover{ background:rgba(255,255,255,0.06); }
.cal-daynum{ font-size:12px; font-weight:500; line-height:1; }
.cal-cell.cal-today .cal-daynum{ color:var(--brass); font-weight:700; }
/* Today gets a full border, not just a brass numeral (user QA #3) — a coloured
   digit is easy to lose among the marks, and the selected day already owns the
   filled-background treatment, so an outline is the one that stays distinct
   from it even when today IS the selected day. */
.cal-cell.cal-today{ border-color:var(--brass); }
.cal-cell.cal-selected{ background:rgba(198,138,62,0.22); border-color:var(--brass); }
.cal-marks{ display:flex; flex-wrap:wrap; gap:2px; justify-content:center; align-items:center; padding:0 2px; }
.cal-mark{ display:inline-block; width:6px; height:6px; border-radius:50%; }
.cal-mark-appt{ background:var(--yellow); }
.cal-mark-event{ background:var(--text-primary); }
.cal-mark-dl-next, .cal-mark-dl-current{ width:3px; height:11px; border-radius:1px; }
.cal-mark-dl-next{ background:var(--red); }
.cal-mark-dl-current{ background:var(--forest); }  /* a project deadline — same colour as its lane */
.cal-mark-proj.cal-mark-appt{ background:transparent; border:1.5px solid var(--yellow); }
.cal-mark-proj.cal-mark-event{ background:transparent; border:1.5px solid var(--text-soft); }
.cal-mark-done{ opacity:0.4; }
.cal-mark-overflow{ font-family:var(--font-mono); font-size:9px; color:var(--text-soft); line-height:1; }
.cal-agenda{ display:flex; flex-direction:column; gap:5px; }
.cal-agenda-row{
  display:flex; align-items:center; gap:9px; text-align:left; width:100%;
  border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.04);
  color:var(--text-primary); border-radius:8px; padding:9px 11px; font-size:13.5px;
}
.cal-agenda-row:hover{ background:rgba(255,255,255,0.09); }
.cal-agenda-done{ opacity:0.5; }
.cal-agenda-dot{ flex:0 0 auto; width:8px; height:8px; border-radius:50%; }
.cal-agenda-dot.cal-mark-dl-next, .cal-agenda-dot.cal-mark-dl-current{ width:3px; height:14px; border-radius:1px; }
.cal-agenda-when{ flex:0 0 auto; font-family:var(--font-mono); font-size:11px; color:var(--text-soft); min-width:52px; }
.cal-agenda-title{ flex:1; }
.cal-agenda-kind{ font-family:var(--font-mono); font-size:10px; color:var(--text-soft); }
.cal-day-empty{ color:var(--text-soft); font-size:13px; text-align:center; padding:24px 0; }
/* List view (QA #33): a day heading above each run of rows. The rows themselves
   are Day view's rows, unchanged — only the heading is new.
   ⚑ NOT sticky, deliberately. The screen's background is a wood TEXTURE
   (.screen-overlay), so a sticky heading needs an opaque fill and would drag a
   flat patch across the grain as it scrolls. A heading that scrolls with its
   rows costs nothing and looks like the rest of the app. */
.cal-list-daylabel{
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--text-soft);
  padding:4px 2px; margin-top:7px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.cal-list-daylabel:first-child{ margin-top:0; }
.cal-list-daylabel.is-today{ color:var(--brass); }
.cal-list-daylabel.is-overdue{ color:var(--red); border-bottom-color:rgba(194,74,61,0.45); }
/* Overdue rows carry a red left edge — the same signal the passed deadline chip
   uses, so "late" reads the same everywhere. */
.cal-agenda-overdue{ border-left:2px solid var(--red); }
.cal-tickler-tag{ font-family:var(--font-mono); font-size:9px; color:var(--dusty); border:1px solid rgba(110,144,172,0.5); border-radius:6px; padding:0 5px; }
/* A section of the page now, not chrome: no solid backdrop to hide the lanes
   behind it, just a rule separating it from the dates above.
   ⚑ The gap above the rule was 6px, which read as cramped in Day view — the
   last agenda row sat almost on the divider, so the controls looked like part
   of the day's list rather than a separate section (user). Widened to 22px;
   the rule now has room to do its job. */
.cal-create{
  flex:0 0 auto; display:flex; flex-direction:column; gap:8px;
  border-top:1px solid rgba(255,255,255,0.12);
  margin-top:22px; padding-top:14px;
}
.cal-seg{ display:flex; gap:0; border:1px solid rgba(255,255,255,0.16); border-radius:8px; overflow:hidden; align-self:flex-start; }
.cal-seg-btn{ background:transparent; color:var(--text-soft); border:none; font-family:var(--font-body); font-weight:600; font-size:12px; padding:6px 16px; }
.cal-seg-btn.active{ background:var(--brass); color:var(--dark-on-accent); }
.cal-seg-small .cal-seg-btn{ padding:5px 12px; font-size:11.5px; }
/* The project page's Actions | Notes switch. Same control as the calendar's
   creation row — deliberately not a new pattern for a new place. */
/* ⚑ The lane's accent, not brass. The calendar's copy of this control is brass
   because the calendar has no lane; on a project page everything else — the
   badge, the Complete pill, the checkboxes — is the Projects green, and a brass
   switch in the middle of it read as borrowed from another screen. */
.project-linked-seg{ margin:0 0 8px 0; border-color:color-mix(in srgb, var(--lane-accent, var(--brass)) 45%, transparent); }
.project-linked-seg .cal-seg-btn.active{ background:var(--lane-accent, var(--brass)); }
/* Sits under the note list as its own affordance, matching the lane accent the
   rest of this page uses. Full width so it reads as "add to this list" rather
   than as another list row. */
/* A note staged on an unsaved project: present, but not yet a thing you can
   open. Dashed to say "not committed", matching the app's other provisional
   states rather than inventing a look for it. */
.staged-note{
  border-style:dashed !important;
  opacity:0.82; cursor:default;
}
.project-add-note{
  width:100%; margin-top:8px;
  border:1px dashed color-mix(in srgb, var(--lane-accent, var(--brass)) 55%, transparent);
  color:var(--lane-accent, var(--brass)); background:transparent;
}
.project-add-note:hover{
  background:color-mix(in srgb, var(--lane-accent, var(--brass)) 14%, transparent);
}
.seg-count{
  font-family:var(--font-mono); font-size:9.5px; opacity:0.75;
  margin-left:3px; vertical-align:1px;
}
.cal-create-main{ display:flex; gap:6px; }
.cal-name{
  flex:1; min-width:0; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.06);
  color:var(--text-primary); border-radius:8px; padding:10px 12px; font-size:14px;
}
.cal-name::placeholder{ color:var(--text-soft); }
.cal-name:focus{ outline:2px solid var(--brass); outline-offset:1px; }
.cal-add-btn{
  flex:0 0 auto; border:none; background:var(--brass); color:var(--dark-on-accent);
  font-weight:700; font-size:13.5px; border-radius:8px; padding:0 18px;
}
/* §8 (review-surface-plan.md, RULED): "More options" moved off the bottom
   (up beside the Event/Deadline toggle) — but the row of space it vacated
   stays, so the panel keeps a bit of margin rather than closing up flush.
   Roughly the height + gap of the button that used to sit here. */
.cal-create-controls{ display:flex; flex-direction:column; gap:7px; padding-bottom:28px; }
.cal-boxed{
  display:flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.04); border-radius:8px; padding:0 10px; min-height:34px;
}
.cal-boxed .field-icon{ font-size:13px; opacity:0.8; flex:0 0 auto; }
.cal-boxed input, .cal-boxed select{ border:none; background:transparent; color:var(--text-primary); font-size:12.5px; padding:8px 0; min-width:0; }
.cal-boxed select{ flex:1; }
.cal-boxed input:focus, .cal-boxed select:focus{ outline:none; }
.cal-hint{ font-size:10.5px; color:var(--text-soft); flex:0 0 auto; }
.cal-interval{ width:42px; text-align:center; flex:0 0 auto; border:1px solid rgba(255,255,255,0.16)!important; border-radius:6px!important; }
.cal-desc{
  border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.04); color:var(--text-primary);
  border-radius:8px; padding:8px 11px; font-size:12.5px;
}
.cal-desc::placeholder{ color:var(--text-soft); }
.cal-tickler-row{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-soft); }
.cal-tickler-row input{ flex:0 0 auto; }
/* §9 (review-surface-plan.md): a dismissible bubble — sibling pill + clear
   button, same shape as .bundle-pill-wrap, so a tap near the edge dismisses
   rather than triggering "Make this a habit instead". */
.cal-habit-bubble-wrap{ display:inline-flex; align-items:center; gap:3px; align-self:flex-start; }
.cal-habit-bubble{
  border:1px dashed var(--purple); background:rgba(142,111,176,0.12);
  color:var(--purple); border-radius:8px; padding:7px 12px; font-size:12px; font-weight:600; text-align:left;
}
.cal-habit-bubble:hover{ background:rgba(142,111,176,0.2); }
.cal-habit-bubble-clear{ font-size:15px; line-height:1; color:var(--text-soft); padding:2px 5px; }
/* "More options →" — the way from the quick-add row to the full event page.
   §8 (review-surface-plan.md, RULED): moved up beside the Event/Deadline
   toggle and given a grey fill for contrast, reusing the app's existing
   neutral raised fill (same as .review-notnow / the 2-min chip) rather than
   minting a new one. The old "deliberately quieter than the habit bubble"
   framing is gone (author, §9.4): the two controls answer different
   questions and were never competing for the same attention. */
.cal-seg-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.cal-advanced-btn{
  align-self:flex-start; border:1px solid rgba(255,255,255,0.18); background:rgba(255,255,255,0.11);
  color:var(--text-primary); border-radius:8px; padding:7px 12px; font-size:12px;
  font-weight:600; text-align:left;
}
.cal-advanced-btn:hover{ background:rgba(255,255,255,0.16); }
.screen-pause-btn{
  align-self:stretch; border:1px solid var(--dusty); background:transparent; color:var(--dusty);
  border-radius:8px; padding:9px 12px; font-size:13px; font-weight:600; text-align:center;
}
.screen-pause-btn.armed{ background:var(--dusty); border-color:var(--dusty); color:var(--dark-on-accent); }
.cal-widget{
  display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; width:100%;
  border:1px solid var(--yellow); background:rgba(217,166,44,0.08);
  border-radius:10px; padding:14px 12px; margin-bottom:10px; color:var(--text-primary);
}
.cal-widget:hover{ background:rgba(217,166,44,0.14); }
/* A big square calendar icon (~4 rows tall/wide), centred, with the upcoming
   events listed beneath it (user layout request). */
.cal-widget-icon{ flex:0 0 auto; width:72px; height:72px; display:flex; align-items:center; justify-content:center; font-size:56px; line-height:1; }
.cal-widget-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:12.5px; width:100%; }
.cal-widget-list li{ max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cal-widget-when{ font-family:var(--font-mono); font-size:11px; color:var(--yellow); }
.cal-widget-empty{ color:var(--text-soft); }
.completed-series-count{ font-family:var(--font-mono); font-size:11px; color:var(--text-soft); }
.event-occ-hint{ font-size:11.5px; color:var(--text-soft); background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:7px; padding:7px 10px; line-height:1.4; }
.it-moved-banner{
  position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translate(-50%, 18px);
  z-index:60; background:var(--paper-2); color:var(--text-primary); border:1px solid var(--brass);
  border-radius:20px; padding:10px 18px; font-size:13px; font-weight:600; box-shadow:0 6px 18px rgba(0,0,0,0.5);
  opacity:0; transition:opacity .28s ease, transform .28s ease; pointer-events:none; max-width:88vw; text-align:center;
}
.it-moved-banner.show{ opacity:1; transform:translate(-50%, 0); }

/* Chunk 9: the service worker's update-ready banner. Same visual language as
   .it-moved-banner (fixed, bottom-centre, paper-2/brass chrome) but this one
   is interactive — pointer-events stay on, and it has no auto-dismiss, since
   it sits there until the user acts or the tab closes. */
.sw-update-banner{
  position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  z-index:60; background:var(--paper-2); color:var(--text-primary); border:1px solid var(--brass);
  border-radius:20px; padding:10px 10px 10px 18px; font-size:13px; font-weight:600;
  box-shadow:0 6px 18px rgba(0,0,0,0.5); max-width:88vw;
  display:flex; align-items:center; gap:12px;
}
.sw-update-banner[hidden]{ display:none; }
.sw-update-reload{
  border:none; border-radius:14px; padding:7px 14px; font-size:12.5px; font-weight:700;
  background:var(--brass); color:var(--dark-on-accent); flex:none;
}
.sw-update-reload:hover{ filter:brightness(1.08); }
.sw-update-reload:active{ transform:translateY(1px); }

/* ----------------------------------------------------------------------------
   REDUCED MOTION — honor the OS preference (quality floor).
---------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
}

/* The calendar opened FROM a project (user): a line saying which project the
   event will attach to, and — when the date is refused — why. The message goes
   ABOVE the field because "after the deadline" is not a reason a dashed outline
   can carry on its own. */
.cal-for-project{
  font-size:12px; color:var(--text-soft); margin-bottom:6px;
}
.cal-for-project b{ color:var(--text-primary); font-weight:600; }
.cal-error{
  font-size:12.5px; color:var(--red); margin-bottom:6px;
  border-left:2px solid var(--red); padding-left:8px;
}

/* The project page's creation buttons, replacing the two quick-add rows (user).
   Stacked full-width so they read as one group of "add to this project"
   choices rather than as three unrelated controls. */
.project-add-row{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.project-add-row .project-add-note{ margin-top:0; }
/* §4.3's "a new project needs an action" block outlines the group now — the
   quick-add row it used to mark is gone. */
.project-add-row.field-invalid{
  border:1px dashed var(--red); border-radius:9px; padding:6px;
}

/* The build marker at the foot of the ⋯ menu. Deliberately dim and small: it is
   there to be found when you need it, not to be read every time. */
.settings-build{
  font-family:var(--font-mono); font-size:9.5px; color:var(--text-soft);
  opacity:0.65; padding:8px 12px 4px; text-align:right;
  border-top:1px solid rgba(255,255,255,0.07); margin-top:4px;
}

/* ⋯ → Debugging. A switch rather than a tick: these turn something on that
   stays on, unlike the background rows which are a one-of-many choice. */
.settings-switch{
  flex:0 0 auto; width:26px; height:15px; border-radius:8px;
  background:rgba(255,255,255,0.14); position:relative; transition:background .15s ease;
}
.settings-switch::after{
  content:""; position:absolute; top:2px; left:2px; width:11px; height:11px;
  border-radius:50%; background:var(--text-soft); transition:transform .15s ease, background .15s ease;
}
.settings-switch.on{ background:color-mix(in srgb, var(--brass) 55%, transparent); }
.settings-switch.on::after{ transform:translateX(11px); background:var(--brass); }
.si-note{
  display:block; font-size:10.5px; color:var(--text-soft); font-weight:400;
  margin-top:2px; line-height:1.35; white-space:normal;
}

/* ============================================================================
   THE INTRAY HANDLE  (the one sanctioned phone change this round)
   ----------------------------------------------------------------------------
   The header's 📥 is gone. In its place a mark on the LEFT SCREEN EDGE, which
   is where the drawer actually comes from — the control now points at the
   thing it opens instead of sitting three inches away from it.

   ⚑ TAP ONLY. The left edge belongs to the browser's back-swipe gesture, so this
   must never become a drag/pull target. The existing swipe-open from the left
   third still works; the handle is an affordance on top of it, not a
   replacement.

   ⚑ REVISION, PHONE ONLY (user: "it works, but it's visually distracting" —
   later clarified as phone-only; the desktop block was fine as first shipped).
   Below is the ORIGINAL solid-tab design, still the desktop default. The
   revised, less-block-y design lives in the ≥1000px-max media query further
   down and is overridden BACK to this look inside the desktop breakpoint.
   ⚠ Two markup nodes ride together in the button now — `.tray-handle-glyph`
   (the original single arrow character) and two `.tray-handle-chevron` spans
   (the phone's line-drawn double chevron) — and each breakpoint shows exactly
   one of the two, never both, never neither.

   Hit area stays a real ≥44px-tall target on the phone even though little
   paints across most of it on the newer look — the chevrons are small on
   purpose, the tap target is not.

   z-index 150: over lane content and the header, UNDER the tray backdrop (210)
   and any drafting page (200). It rides OVER the gold band rather than being
   inset from it — an object on the edge of the desk, which reads correctly.
   It is fully display:none — not just faint — the instant a drafting page
   opens (below), on EITHER layout.
============================================================================ */
#tray-handle{
  position:fixed; left:0; top:34%; z-index:150;
  width:22px; min-height:58px; padding:12px 0;
  border:none; border-radius:0 9px 9px 0;
  background:rgba(244,240,232,0.93); color:#1a1408;
  font-size:16px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-shadow:2px 0 12px rgba(0,0,0,0.5);
  transition:opacity .14s ease, background .14s ease;
}
#tray-handle:hover{ background:#fff; }
/* The phone-only chevrons are hidden by default (desktop shows the glyph). */
.tray-handle-chevron{ display:none; }
/* Hidden while the drawer is open, and back only AFTER the .28s slide-out — the
   class is dropped on the same 300ms timer the drawer's teardown uses, so it
   never pops in over a moving drawer. */
body.tray-open #tray-handle{ opacity:0; pointer-events:none; }
/* A drafting page owns the whole screen; the handle would float over its scrim. */
body.screen-open #tray-handle{ display:none; }

/* The other half of the same control: an arrow on the drawer's own edge that
   puts it away. position:fixed inside the drawer (whose transform makes it the
   containing block) so it rides the slide and ignores the drawer's scrolling. */
.tray-edge-handle{
  position:fixed; right:0; top:34%; z-index:2;
  width:22px; min-height:58px; padding:12px 0;
  border:none; border-radius:9px 0 0 9px;
  background:rgba(244,240,232,0.93); color:#1a1408;
  font-size:16px; font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
  box-shadow:-2px 0 12px rgba(0,0,0,0.45);
}
.tray-edge-handle:hover{ background:#fff; }

/* ▲ PHONE-ONLY REVISION (user: "it works, but it's visually distracting" —
   the desktop block was intentionally left alone; only the phone was ever
   meant to change). Below 1000px — the same number as DESKTOP_MIN_PX in
   app.js, mirrored here as max-width so the two thresholds can never land on
   different sides of the same pixel — both handles swap from a solid tab to a
   quieter mark: no background block (only the mark itself draws), the single
   bold glyph becomes two nested line-drawn chevrons (the same construction as
   the calendar's own ‹ › nav arrows — border corners rotated 45°, not a font
   character), and the vertical position moves from an upper-third guess to
   the screen's dead center. */
@media (max-width:999.98px){
  #tray-handle, .tray-edge-handle{
    top:50%; transform:translateY(-50%);
    min-height:0; height:44px; padding:0; border-radius:0;
    background:transparent; box-shadow:none;
    gap:2px; color:rgba(237,231,218,0.5);
  }
  #tray-handle:hover, .tray-edge-handle:hover{ background:transparent; color:rgba(237,231,218,0.92); }
  .tray-handle-glyph{ display:none; }
  /* Two nested line-drawn chevrons. Each is a corner of a square, rotated 45°
     so two adjoining border edges form a ">" stroke. The pair sits close
     enough to read as one "expand this way" mark, not two separate arrows. */
  .tray-handle-chevron{
    display:block; width:7px; height:7px; flex:0 0 auto;
    border-top:2px solid currentColor; border-right:2px solid currentColor;
    transform:rotate(45deg);
  }
  /* The drawer's own arrow points the opposite way: the same corner rotated
     -135° (225°) flips the stroke's tip from "›" to "‹". */
  .tray-edge-handle .tray-handle-chevron{ transform:rotate(-135deg); }
}

/* One variable for the drawer's width, so the desktop widening (author note 1)
   is a single number and the jade inlay keeps working at either size. */
:root{ --tray-w: min(360px, 86vw); }

/* ============================================================================
   THE DRAFTING CARD WRAPPER  (mobile: invisible; desktop: the card)
   `.screen-card` is rendered in both modes on purpose — see renderScreen.
============================================================================ */
/* The desktop column head and per-lane create row are rendered into every lane
   in both modes and HIDDEN on the phone — the mobile markup is untouched, just
   not shown (trap T8: hide per mode, don't delete). */
.lane-colhead, .lane-create-row{ display:none; }

.screen-card{ display:flex; flex-direction:column; flex:1 1 auto; min-height:0; width:100%; }
/* The desktop footer (Done / Delete). Not rendered at all on the phone, which
   keeps the back arrow and the bin in the header — so exactly one element ever
   carries data-action="screen-save". */
.screen-footer{ display:none; }
/* The "what happens on Done" group. `display:contents` on the phone means the
   Complete pill keeps its floating position and the convert button keeps its
   place in the flow: the grouping is desktop-visible only. */
.screen-outcome-group{ display:contents; }

/* ============================================================================
   ▲ DESKTOP LAYOUT  (>=1000px)
   ----------------------------------------------------------------------------
   ⚠ THIS NUMBER IS MIRRORED IN ONE PLACE IN JS: DESKTOP_MIN_PX in app.js. They
   must never drift — a half-desktop state (three columns, still showing the FAB)
   is what two sources of truth look like.

   Below it, the phone app exactly as it shipped. A half-snapped laptop window
   gets the mobile layout; that is intended.
============================================================================ */
@media (min-width:1000px){
  /* --- the tab bar retires; its spacer keeps reserving the fixed header --- */
  .tabbar{ display:none; }
  .tabbar-spacer{ height:calc(var(--header-h) + 22px); }
  /* --- the floating + retires; every column has its own real buttons --- */
  #fab-create, .fab-menu{ display:none !important; }

  /* --- header: dropdowns left, OELA centered, gear right (author notes 8/9) --- */
  .header-left{ display:flex; align-items:center; gap:8px; }
  header .brand{ position:absolute; left:50%; transform:translateX(-50%); }
  .header-drop{ position:relative; }
  .header-drop-btn{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid rgba(237,231,218,0.16); background:rgba(237,231,218,0.05);
    color:var(--text-primary); border-radius:9px; padding:7px 11px; font-size:13px;
  }
  .header-drop-btn:hover{ background:rgba(237,231,218,0.10); }
  .hdr-drop-icon{ font-size:13px; line-height:1; }
  .hdr-drop-value{ max-width:132px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hdr-drop-caret{ color:var(--text-soft); font-size:10px; }
  /* Reuses .settings-menu's chrome, but anchored to its own button rather than
     to the header's right edge. */
  .header-drop-menu{
    position:absolute; top:calc(100% + 7px); left:0; right:auto;
    min-width:210px; max-width:280px;
  }
  .header-drop-menu[hidden]{ display:none; }

  /* --- three columns (ruling 2) ---------------------------------------------
     No explicit grid-column anywhere: every pair is contiguous in ALL_LANES and
     the pairs are in column order, so auto-placement puts the three visible
     lanes in the right cells on its own.
     ⚠ ONE scrolling document (trap T16) — the columns grow downward and the page
     scrolls as a whole. Per-column scrollbars fight both the frame and
     lockBodyScroll. */
  .lanes{
    max-width:1460px;
    display:grid; grid-template-columns:repeat(3, minmax(0,1fr));
    gap:14px 26px; align-items:start;
  }
  .lane{ min-width:0; }

  /* --- one layer of headers (author note 4 / trap T8) ---
     The column toggle IS the lane header on desktop, so the in-lane floating
     label is hidden rather than stacked under it. */
  .lane-label{ display:none; }
  .lane-colhead{ display:flex; align-items:center; gap:8px; margin:2px 0 12px 0; }
  .col-tabs{ display:flex; gap:6px; flex:1 1 auto; min-width:0; }
  .col-tab{
    flex:0 1 auto; min-width:0;
    display:inline-flex; align-items:center; gap:8px;
    border:1px solid rgba(237,231,218,0.18); background:transparent; color:var(--text-soft);
    font-family:var(--font-display); font-weight:700; font-size:14.5px; letter-spacing:0.01em;
    padding:9px 13px; border-radius:9px; white-space:nowrap;
  }
  .col-tab:hover{ background:rgba(237,231,218,0.06); color:var(--text-primary); }
  .col-tab .col-tab-name{ overflow:hidden; text-overflow:ellipsis; }
  .col-tab.active{
    background:var(--lane-accent); border-color:transparent; color:var(--dark-on-accent);
    box-shadow:0 3px 10px rgba(0,0,0,0.35);
  }
  .col-count{
    font-family:var(--font-mono); font-weight:600; font-size:11px;
    background:rgba(237,231,218,0.10); padding:2px 7px; border-radius:10px;
  }
  .col-tab.active .col-count{ background:rgba(0,0,0,0.2); }
  .col-tab.active:hover{ background:var(--lane-accent); color:var(--dark-on-accent); }
  /* The info button sits outside the lit pill now, so it needs its own outline.
     It still toggles the same .lane-info panel via the same handler. */
  .col-info{
    flex:0 0 auto; background:transparent; color:var(--text-soft);
    border:1px solid rgba(237,231,218,0.22);
  }
  .col-info:hover{ background:rgba(237,231,218,0.08); color:var(--text-primary); }

  /* --- per-lane create buttons (author note 5 / trap T4) --- */
  .lane-create-row{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px 0; }
  .lane-create-btn{ border-color:rgba(237,231,218,0.26); }
  .lane-create-btn:hover{ border-color:var(--lane-accent); color:var(--text-primary); }
  .lane-tools-row{ margin:0 0 10px 0; }

  /* --- drafting pages become centered cards (ruling 4) ---
     Same overlay node as the phone: the overlay becomes the SCRIM and the card
     is the inner wrapper. The entrance differs in CSS alone — slide on mobile,
     fade-and-settle here. */
  .screen-overlay{
    background:rgba(8,6,5,0.62);
    display:flex; align-items:center; justify-content:center;
    padding:34px 20px;
    transform:none; opacity:0; transition:opacity .16s ease;
  }
  .screen-overlay.open{ transform:none; opacity:1; }
  .screen-card{
    flex:0 1 auto; width:min(700px, 100%); max-height:100%;
    background:var(--desk) var(--wood);
    background-size:var(--wood-size) var(--wood-size); background-repeat:repeat;
    border:1px solid rgba(237,231,218,0.14); border-radius:14px;
    box-shadow:0 26px 64px rgba(0,0,0,0.62);
    overflow:hidden;
    transform:scale(0.985); transition:transform .16s ease;
  }
  .screen-overlay.open .screen-card{ transform:scale(1); }
  /* Project pages carry the staged-actions machinery and need the room. */
  .screen-overlay[data-kind="current"] .screen-card,
  .screen-overlay[data-kind="future"] .screen-card{ width:min(880px, 100%); }
  /* ⚑ The review card is back on the base 700px (author): the widening to 780px
     existed ONLY to fit the capture card's 8-chip single row, and that row is
     gone — desktop now wraps to 6 + 2, closer to phone. No override needed. */
  /* ⚑ The calendar is visually a popup and structurally the SAME screen (ruling
     6). Widening the card is only half of it: the month grid is sized against
     .screen-body's 640px column, so that column has to widen for this screen
     only (trap T11). */
  /* §10 (review-surface-plan.md, RULED — Proposal A, "the desktop calendar is
     broken"): the previous round's fix (a bare width cap on the grid) only
     ever addressed the WIDTH axis. .cal-cell carries a fixed aspect-ratio, so
     height still followed width — six rows of even a capped-width grid still
     ran to ~630px tall, and with .cal-create stacked below it too, the create
     row (name field, Event/Deadline toggle, Add button) sat off-screen on a
     1366x768 laptop: measured at 1073px needed against 644px available.
     The real fix is two changes together, and neither is sufficient alone
     (measured): flatten the cell's aspect ratio so six rows fit well inside
     any reasonable viewport height, AND move .cal-create beside the grid
     instead of below it, which is what actually returns the Add button (and,
     for Day/List, most of a ~628px empty reserve) to above the fold. Column
     order is CONTROLS-left / CALENDAR-right (author correction after Proposal
     A was chosen — the first mockup showed the reverse). */
  .screen-overlay[data-kind="calendar"] .screen-card{ width:min(1040px, 100%); }
  .screen-overlay[data-kind="calendar"] .cal-body{
    display:grid; grid-template-columns:300px 1fr; column-gap:24px; align-items:start;
    /* The grid's own width cap is unchanged from the previous round (the width
       axis was never the bug) — --cal-cell-w recomputed against the SAME
       660px cap, on the SAME element, which --cal-grid-h already reads via
       var(). 0.63 replaces the phone's 1.15: wide rectangles (~92 x 58), not
       near-squares — THIS is what cuts the height. List/Day's reserve (shared
       base rule, .cal-agenda/.cal-day-empty min-height) drops from ~628px to
       ~363px automatically, since it reads the same --cal-grid-h. */
    --cal-cell-w: calc((660px - 40px - 18px) / 7);
    --cal-grid-h: calc(6 * 0.63 * var(--cal-cell-w) + 15px + 20px);
  }
  .screen-overlay[data-kind="calendar"] .cal-cell{ aspect-ratio:1/0.63; }
  /* The right column: month/day nav, then whichever of the three view bodies
     is rendered — always exactly two stacked rows, since only one of
     (monthnav|daynav) and one of (swipe-viewport|agenda|day-empty) is in the
     DOM at a time. */
  .screen-overlay[data-kind="calendar"] .cal-monthnav,
  .screen-overlay[data-kind="calendar"] .cal-daynav,
  .screen-overlay[data-kind="calendar"] .cal-swipe-viewport,
  .screen-overlay[data-kind="calendar"] .cal-agenda,
  .screen-overlay[data-kind="calendar"] .cal-day-empty{
    grid-column:2; max-width:660px;
  }
  .screen-overlay[data-kind="calendar"] .cal-swipe-viewport{ margin:0; }
  /* The left column: the whole create panel, spanning both of the right
     column's rows so it reads as a sidebar, not a third stacked row. §8's
     "More options" already sits at the top of this panel (paired with the
     Event/Deadline toggle, shared markup with the phone) — no separate
     desktop placement needed, per §8.2's ruling that it "has no separate
     existence from this layout." The phone's top divider (border/margin
     separating .cal-create from the grid ABOVE it) is dropped here — there is
     no "above" relationship once this is a side column. Deadline's shorter
     panel is left top-aligned rather than centered/stretched to match Event's
     height (builder's call — simplest, and top alignment reads as an
     ordinary short form, not a broken one; flagged in case the author wants
     it visually balanced instead). */
  .screen-overlay[data-kind="calendar"] .cal-create{
    grid-column:1; grid-row:1/3; align-self:start;
    border-top:none; margin-top:0; padding-top:0;
  }
  .screen-body{
    max-width:none; padding:18px 26px 22px 26px;
  }
  .screen-header{ padding:12px 20px 12px 26px; }
  .screen-footer{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex:0 0 auto; padding:14px 26px calc(14px + env(safe-area-inset-bottom)) 26px;
    border-top:1px solid rgba(237,231,218,0.12);
  }
  .screen-footer-done{
    border:none; background:var(--brass); color:var(--dark-on-accent);
    font-weight:700; font-size:14px; padding:11px 32px; border-radius:9px;
    box-shadow:0 3px 12px rgba(0,0,0,0.4);
  }
  .screen-footer-done:hover{ filter:brightness(1.08); }
  /* Maximum distance from Done, and danger-styled so the two never read alike. */
  .screen-footer-delete{
    border:1px solid rgba(194,74,61,0.5); background:transparent; color:var(--red);
    font-size:13px; font-weight:600; padding:10px 16px; border-radius:9px;
  }
  .screen-footer-delete:hover{ background:rgba(194,74,61,0.14); }
  .screen-chrome-spacer{ display:inline-block; width:22px; }

  /* --- Complete + Convert as ONE group (ruling 4 / trap T10) ---
     They are the same kind of control — a declaration about what the item
     becomes on save — and their mutual exclusion is only legible when they sit
     next to each other. The pill stops floating and joins the flow. */
  .screen-outcome-group{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    border:1px solid rgba(237,231,218,0.14); border-radius:10px;
    padding:12px 14px; margin-top:2px;
  }
  .screen-outcome-group .screen-complete-pill{
    position:static; right:auto; bottom:auto; box-shadow:none; flex:0 0 auto;
  }
  .screen-outcome-group .screen-make-kind-btn{ align-self:auto; flex:0 1 auto; }

  /* --- the intray, wider (author note 1) --- */
  :root{ --tray-w: min(440px, 86vw); }

  /* --- the gold-leaf frame wraps the WHOLE PAGE (author note 10 / trap T14) ---
     Every other surface has --frame-inset:0, so all of this collapses to nothing
     unless the lacquer desk is on. */
  body.has-frame header{ top:var(--frame-inset); left:var(--frame-inset); right:var(--frame-inset); }
  body.has-frame .tabbar-spacer{ height:calc(var(--header-h) + 22px + var(--frame-inset)); }
  body.has-frame main{
    padding-left:calc(20px + var(--frame-inset));
    padding-right:calc(20px + var(--frame-inset));
    padding-bottom:calc(40px + var(--frame-inset));
  }
  /* The band is on the viewport now, not on main's box — so the lanes must NOT
     also pad themselves in by the same amount. */
  body.has-frame .lanes{ padding:0; }

  /* --- the review's capture card: three rows, 6 / 2 / 2 (author) ---
     Was one grouped 8-chip row on a widened card. That row is what forced the
     780px card, and it read nothing like the phone. Desktop now mirrors phone's
     SHAPE (lane chips, then Calendar + 2 min, then Not now / Delete) while
     keeping its own arrangement of the lane chips: phone stacks them 3 + 3,
     desktop puts all six on one row, because desktop's lanes are three
     permanent side-by-side columns rather than a paged tab bar.

     Phone's `order` is cancelled so the pair-major DOM order (Next/Waiting,
     Project/Future, Habit/Note) reads left to right as-is — the same adjacency
     desktop's own column headers show side by side, with a wider gap between
     the three pairs than within one. */
  /* ⚑ row-gap only, NOT the `gap` shorthand (author: "about half a row of space
     between rows"). A chip row measures 37px here, so 18px is the half-row.
     The column gap must stay 7px — the six-across flex-basis below subtracts a
     fixed 78px (5 × 7px column gaps + 2 × 20px pair margins + 3px slack), and
     widening it with the shorthand would push Note onto its own row. */
  .review-sort-chips{ display:flex; flex-wrap:wrap; justify-content:center; row-gap:18px; }
  .review-sort-chips .review-menu-btn{ flex:0 1 auto; }
  /* [data-target] (attribute-exists) matches every chip, INCLUDING quickdone
     — same specificity as the mobile rules' [data-target="x"] selectors, so
     this wins the cascade tie by source order instead of losing outright to a
     plain .review-menu-btn reset (lower specificity always loses regardless
     of order). */
  .review-sort-chips .review-menu-btn[data-target]{ order:0; }
  /* The six lane chips take a deterministic percentage basis, exactly as phone
     does for its 1/3 — content-based widths would let a long label decide how
     many fit and silently drop one to the next row. 7px × 5 gaps + 20px × 2
     pair margins = 75px of fixed space, +3px of rounding slack. Calendar and
     2 min keep flex:0 1 auto (above) and so wrap to row 2 at their natural
     width, centred by justify-content. */
  .review-sort-chips .review-menu-btn[data-target="next"],
  .review-sort-chips .review-menu-btn[data-target="waiting"],
  .review-sort-chips .review-menu-btn[data-target="current"],
  .review-sort-chips .review-menu-btn[data-target="future"],
  .review-sort-chips .review-menu-btn[data-target="habit"],
  .review-sort-chips .review-menu-btn[data-target="notes"]{ flex:0 0 calc((100% - 78px) / 6); }
  .review-sort-chips .review-menu-btn[data-target="waiting"],
  .review-sort-chips .review-menu-btn[data-target="future"]{ margin-right:20px; }
  /* Note ends row 1 — a trailing separator with nothing after it, and its
     margin would still count toward the line's width and push Note onto row 2. */
  .review-sort-chips .review-menu-btn[data-target="notes"]{ margin-right:0; }
  /* Same half-row rhythm across the LAST row boundary too, so all three rows
     are evenly spaced rather than two loose and one tight. .review-card already
     gaps its children by 12px, so this tops it up to the same 18px.
     ⚑ Scoped to the capture card specifically (review-card-capture) — once
     .review-menu-row became the universal band-3 corner row (§5a), this rule
     would otherwise also add its 6px to every banded card's corner row on
     top of the band divider's own 7px, a rhythm that was only ever tuned for
     capture's three chip-rows. */
  .review-card-capture .review-menu-row{ margin-top:6px; }
  /* §5/§5a band chips (author, third QA round): a little wider, a little more
     room between them, and about half a chip-row of height between bands —
     the same "half row" idea already used for the capture card's own three
     rows (styles.css ~2145), scaled to THIS chip's height, not copied as a
     literal px value. Structure/order is unchanged from the base rules —
     centered, wrapping, same-layout-as-phone — only these three measurements
     grow on the wider surface. */
  .review-band{ gap:12px; }
  .review-band .review-menu-btn{ padding:10px 22px; }
  /* Half a chip row of total whitespace between bands (chips measure ~39px
     tall here, so ~20px) — .review-menu's own 7px flex-gap is fixed/shared
     with every other review card, so margin+padding make up the rest. */
  .review-band + .review-band,
  .review-band + .review-menu-row{ margin-top:5px; padding-top:8px; }
}

/* The frame's desktop geometry: pinned to the viewport, over the header, under
   the tray handle and any drafting page. Set by drawDeskFrame, not by a media
   query, because the JS also has to change what it measures. */
#desk-frame.frame-fixed{ position:fixed; top:0; left:0; z-index:140; }
</style>
</head>
<body>

<!-- The header's LEFT cluster is desktop-only and built by JS
     (renderHeaderWidgets): Language and Background dropdowns, then the Calendar
     button, which is MOVED here rather than duplicated. On the phone this div
     is empty and the header is exactly what it always was — minus the 📥, which
     retires on both layouts in favour of the tray handle on the left screen
     edge (#tray-handle, below). -->
<header>
  <div class="header-left" id="header-left"></div>
  <div class="brand"><span class="mark">OELA</span></div>
  <div class="header-right">
    <button class="header-icon" type="button" title="Calendar" data-action="open-calendar">&#128197;</button>
    <button class="header-icon" type="button" title="More" data-action="open-overflow">&#8943;</button>
  </div>
</header>

<!-- The intray handle: a mark on the LEFT SCREEN EDGE, on both layouts. It
     keeps data-action="open-tray" — the action name is the contract, not the
     button's position. Tap only: the left edge belongs to the browser's
     back-swipe gesture, so this must never be a drag target. It hides while the
     drawer is open (the drawer's own arrow closes it).
     ⚑ Carries BOTH looks at once and lets styles.css pick one per breakpoint:
     `.tray-handle-glyph` is the original single-arrow character (desktop,
     unchanged since it was never the part flagged as distracting); the two
     `.tray-handle-chevron` spans are the phone-only line-drawn double chevron.
     Exactly one shows at a time — see the revision note in styles.css. -->
<button id="tray-handle" type="button" data-action="open-tray" title="Intray" aria-label="Intray">
  <span class="tray-handle-glyph" aria-hidden="true">&#8250;</span>
  <span class="tray-handle-chevron" aria-hidden="true"></span>
  <span class="tray-handle-chevron" aria-hidden="true"></span>
</button>

<!-- Compact letter+icon panels, no horizontal scroll (user round). Related
     lanes share one panel, split into two independently-tappable halves --
     Next/Waiting and Projects/Someday. Habits stands alone for now; its
     natural partner is Notes, which has no lane yet (chunk 6) -- when it
     lands, Habits pairs with it the same way. tab-name is kept (visually
     hidden) for accessibility -- the letter+icon are decorative shorthand,
     not the accessible label. -->
<nav class="tabbar" id="lane-switcher" role="tablist">
  <div class="tab-pair">
    <button class="tab active" data-kind="next"><span class="tab-letter">N</span><span class="tab-icon">&#9889;</span><span class="tab-count">0</span><span class="tab-name">Next Actions</span></button>
    <button class="tab" data-kind="waiting"><span class="tab-letter">W</span><span class="tab-icon">&#9203;</span><span class="tab-count">0</span><span class="tab-name">Waiting On</span></button>
  </div>
  <div class="tab-pair">
    <button class="tab" data-kind="current"><span class="tab-letter">P</span><span class="tab-icon">&#128296;</span><span class="tab-count">0</span><span class="tab-name">Projects</span></button>
    <button class="tab" data-kind="future"><span class="tab-letter">S</span><span class="tab-icon">&#128301;</span><span class="tab-count">0</span><span class="tab-name">Someday</span></button>
  </div>
  <div class="tab-pair">
    <button class="tab" data-kind="habit"><span class="tab-letter">H</span><span class="tab-icon">&#127937;</span><span class="tab-count">0</span><span class="tab-name">Habits</span></button>
    <button class="tab" data-kind="notes"><span class="tab-letter">✎</span><span class="tab-icon">&#128221;</span><span class="tab-count">0</span><span class="tab-name">Notes</span></button>
  </div>
</nav>
<div class="tabbar-spacer" aria-hidden="true"></div>

<!-- Dev-only scaffolding — not part of the app's designed surface.
     ⚑ HIDDEN BY DEFAULT now (user: "I want to see what the app looks like
     without all the clutter"). Each group is revealed by its own toggle under
     ⋯ → Debugging, and the whole bar collapses to nothing when none are on, so
     the lanes start at the top of the page as they should.
     ⚑ "Reset local data" is GONE, not hidden: Restore app to defaults does the
     same job in the menu where a destructive action belongs, and snapshot /
     restore covers the "put it back" case it was really being used for. -->
<div id="dev-toolbar" hidden>
  <span class="dev-group" data-dev-group="time" hidden>
    <button class="btn btn-ghost btn-small" id="qa-day-btn" title="Dev QA aid: advances the app's clock by one day and re-runs habit boundary processing, so multi-day habit logic (stumbles, misses, run-ending, badges) can be tested without waiting">QA: +1 Day</button>
    <button class="btn btn-ghost btn-small" id="qa-hour-btn" title="Dev QA aid: advances the app's clock by one hour and re-runs habit boundary processing">QA: +1 Hr</button>
    <button class="btn btn-ghost btn-small" id="qa-min-btn" title="Dev QA aid: advances the app's clock by fifteen minutes and re-runs habit boundary processing — fine-grained enough to step through the midnight-4am window where the calendar date and the app's day boundary deliberately disagree">QA: +15 Min</button>
    <span class="qa-time-readout" id="qa-time-readout" title="What the app currently thinks &lsquo;now&rsquo; is, after any QA time jumps"></span>
  </span>

// =========================================================
// STORAGE ADAPTER (spec.md §3, known issue 4)
//
// Every localStorage access in the app goes through this module — nothing
// else calls window.localStorage directly. Three stores grow forever by
// ruling (completed archives, habit run histories, archived Waiting sets),
// so this app WILL eventually hit localStorage's ~5MB ceiling. Before this
// adapter existed, every setItem was uncaught: a QuotaExceededError mid-save
// could throw partway through a multi-store commit, leaving state
// half-persisted with no user-visible error. This catches that and surfaces
// it instead, via the app's own dialog (native alert/confirm/prompt are
// banned app-wide — CLAUDE.md).
// =========================================================
const Storage = {
  get: function(key){
    try { return window.localStorage.getItem(key); }
    catch (e){ return null; }
  },
  getJSON: function(key, fallback){
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e){ return fallback; }
  },
  set: function(key, value){
    try {
      window.localStorage.setItem(key, value);
      return true;
    } catch (e){
      Storage._onWriteError(e);
      return false;
    }
  },
  setJSON: function(key, value){
    return Storage.set(key, JSON.stringify(value));
  },
  remove: function(key){
    try { window.localStorage.removeItem(key); }
    catch (e){ /* removal failing isn't a quota issue; nothing to surface */ }
  },
  keys: function(){
    try { return Object.keys(window.localStorage); }
    catch (e){ return []; }
  },
  // Only QuotaExceededError gets a user-facing message — other storage
  // failures here (disabled storage, privacy mode) are rarer and every
  // read already has a safe fallback, so the app keeps working with
  // whatever it had in memory.
  _onWriteError: function(e){
    if (e && e.name === "QuotaExceededError"){
      openConfirmDialog(
        "Storage is full — the last change couldn't be saved. Free up space " +
        "(clear old completed items, or Reset local data) and try again.",
        [{ label: "OK", style: "primary", action: function(){} }]
      );
    }
  }

  "tutorial.t1.title": {
    en: "1 CLICK HERE TO START THE TUTORIAL",
    "zh-Hans": "1 点击这里开始教程"
  },
  "tutorial.t1.notes": {
    en: "This is a tutorial on the use of OELA, or the Over Engineered List App. This app is intended to help you organize and plan your life. It is partially inspired by the popular system in the book \"Getting Things Done,\" though I have made my own additions to that organizational system as well.\nYou are currently on a drafting page for a next action. These drafting pages allow you to create list items which show up in the various specialized lists in the app. The X in the top right corner exits this page without saving any changes you may have made. If you are on a phone, the exit and save button is the arrow in the top left corner. If you are on a computer, you can click the \"done\" button. To complete this part of the tutorial, hit the complete button then click the done button or tap the arrow. The next card will show up in the list.",
    "zh-Hans": "这是 OELA（Over Engineered List App，过度设计清单应用）的使用教程。本应用旨在帮助你整理事务、规划生活。它的设计部分参考了《搞定》（Getting Things Done）中的经典方法，同时也加入了我自己的一些改进。\n你现在看到的是“下一步行动”的编辑页面。在这里，你可以创建会显示在应用各个列表中的条目。点击右上角的 X 会退出当前页面，并且不会保存任何修改。如果你使用的是手机，保存并退出请点击左上角的箭头；如果使用的是电脑，请点击“保存”按钮。要完成这一部分教程，请先点击“完成”按钮，再点击“保存”按钮或左上角箭头。完成后，下一张教程卡片会出现在列表中。"
  },
  "tutorial.t2.title": {
    en: "2 Tutorial: The interface",
    "zh-Hans": "2 教程：界面介绍"
  },
  "tutorial.t2.notes": {
    en: "You may have noticed those colourful tabs at the top of the page on the main screen. These are the lanes or specialized lists. You can navigate to them by clicking or tapping them. The red list is for next actions. The yellow list is for waiting actions. The green and blue lists are for current and future projects. The purple and teal lists are for habits and notes. There is also a calendar which can be accessed either on the bar at the top of the screen, or through the yellow list.\nEach list has a specialized function and behaves slightly differently. You can see information about the list's purpose and function by pressing the small (i) icon next to the list's header. Try looking around at the different lanes. Exit this drafting page and take a look at the different lists available. When you're done, return to the red list and check the box on this action. The next tutorial card will appear in this list.",
    "zh-Hans": "你可能已经注意到主界面顶部那些彩色标签了。它们就是应用中的各个列表。点击或轻触即可切换。红色列表用于“下一步行动”，黄色列表用于“等待行动”，绿色和蓝色列表分别用于当前项目和将来项目，紫色和青色列表分别用于习惯和笔记。此外，还有一个日历，可以从屏幕顶部的工具栏进入，也可以通过黄色列表进入。\n每个列表都有不同的用途，操作方式也略有区别。点击列表标题旁边的小 (i) 图标，就能查看该列表的用途和功能说明。现在请退出这个编辑页面，浏览一下各个列表。看完之后，回到红色列表，勾选这项行动的复选框。下一张教程卡片就会出现在这个列表中。"
  },
  "tutorial.t3.title": {
    en: "3 Tutorial: Creating Items",
    "zh-Hans": "3 教程：创建条目"
  },
  "tutorial.t3.notes": {
    en: "Now that you've familiarized yourself with the different lists, you're ready to create your first item. If you're using a phone, you may have noticed a floating + badge in the bottom right corner. That is the creation button. Tap that to create items in your current lane. If you're on a computer, the creation buttons will be below the lane header. Go to the red list, and tap the badge or click the button to create a next action. Remember to hit the arrow/done button when you're finished.",
    "zh-Hans": "现在你已经熟悉了各个列表，可以创建你的第一个条目了。如果你使用的是手机，应该已经注意到右下角悬浮着一个 + 按钮，它就是新建按钮。轻触它，就能在当前列表中新建条目。如果你使用的是电脑，新建按钮位于列表标题下方。请切换到红色列表，点击 + 按钮或新建按钮，创建一个“下一步行动”。完成后，别忘了点击左上角箭头或“保存”按钮。"
  },
  "tutorial.t4.title": {
    en: "4 Tutorial: Creating a waiting action",
    "zh-Hans": "4 教程：创建等待行动"
  },
  "tutorial.t4.notes": {
    en: "Now that you've created your first action, it's time to create a waiting action. A waiting action is an action that you plan to take, but it depends on something else. For example, you might plan to book a hotel for your vacation, but you have to book your flight first. When creating a waiting action, this app allows you to give a qualitative description of the thing you're waiting on, but you can also connect it to another action. Now that you've created a next action, go to the waiting action lane (yellow) and create a waiting action connected to the action you created in tutorial 3. When you complete that action, your waiting action will automatically move to the red list.",
    "zh-Hans": "现在你已经创建了第一个行动，接下来可以创建一个“等待行动”。等待行动指的是你打算去做，但必须先等其他事情完成才能进行的行动。例如，你打算预订假期酒店，但必须先订好机票。在创建等待行动时，你可以填写正在等待什么，也可以直接把它关联到另一项行动。现在请前往黄色列表，创建一个等待行动，并将它关联到你在教程 3 中创建的那项“下一步行动”。等那项行动完成后，这个等待行动会自动移到红色列表。"
  },
  "tutorial.t5.title": {
    en: "5 Tutorial: Creating a context",
    "zh-Hans": "5 教程：创建情境"
  },
  "tutorial.t5.notes": {
    en: "While you were creating your actions, you may have noticed the create context button. This button allows you to create a special sub-list in the action lanes. In the Getting Things Done system, contexts are lists of actions organized by where and when you do them. For example, you might have a list of errands which can only be done if your in the car, or a list of calls you can only make if you have a phone. Contexts offer you the opportunity to take an action. In this app, they are shared across both the next action and waiting on lanes, meaning that a waiting item in the calls context in the yellow lane will promote to the calls context in the next actions (red) lane.",
    "zh-Hans": "在创建行动时，你可能已经注意到“创建情境”按钮。这个按钮可以让你在行动列表中创建一个专门的子列表。在《搞定》（Getting Things Done）系统中，情境是按照执行地点或时机来整理行动的方式。例如，你可以建立一个只有开车时才能处理的“跑腿”情境，或者一个只有手边有电话时才能处理的“打电话”情境。情境代表你具备了采取某项行动的条件。在本应用中，情境会同时应用于“下一步行动”和“等待行动”两个列表。也就是说，黄色列表中“打电话”情境里的等待项，在满足条件后，会自动移动到红色列表中对应的“打电话”情境。"
  },
  "tutorial.t6.title": {
    en: "6 Tutorial: Create a project",
    "zh-Hans": "6 教程：创建项目"
  },
  "tutorial.t6.notes": {
    en: "Projects are an important part of the organizational system this app uses. A project is anything you are currently working on that requires more than one action step to complete. Projects can be as simple as replacing a lightbulb, (identifying the type of light your fixture needs, going to the store, putting it in the socket) or as complicated as planning a vacation (booking time off, researching hotels, researching flights, etc.). If it takes more than one physical step, it's a project.\nYou can create projects on the project lane. Every project you create needs at least one linked action or calendar event. You can also create these from the project page.",
    "zh-Hans": "项目是本应用组织系统中非常重要的一部分。凡是你正在进行，而且需要一个以上具体行动步骤才能完成的事情，都属于项目。项目可以简单到换一个灯泡（确认灯泡型号、去商店购买、装进灯座），也可以复杂到规划一次假期（请假、查找酒店、查询航班等）。只要需要多个实际行动步骤，它就是一个项目。\n你可以在项目列表中创建项目。每个项目都必须至少关联一项行动或一个日历事件。你也可以直接在项目页面中创建这些内容。"
  },
  "tutorial.t7.title": {
    en: "7 Tutorial: The capture drawer and the daily review",
    "zh-Hans": "7 教程：收件箱与回顾"
  },
  "tutorial.t7.notes": {
    en: "When you opened the app, you may have noticed the pullout drawer on the right of your screen. On the computer, this drawer can be opened by clicking on the large white handle. On the phone, you can tap the arrows or swipe right. This drawer has a text box so you can capture thoughts, reminders, and information quickly. Whenever you add something to the drawer, it will create a face down card in the drawer. Cards can appear there for other reasons as well. Passed deadlines, projects with no linked actions, and waiting actions which have lost their waiting condition will also appear as face down cards in the drawer.\nYou can review these cards by clicking the \"review\" button. The review system will show them to you one at a time so that you can make decisions about each one. Go to the drawer now and use the review system to link an action to the sample project with no linked actions.",
    "zh-Hans": "打开应用时，你可能已经注意到屏幕右侧的抽屉。在电脑上，点击白色的大把手即可打开；在手机上，可以点击箭头或向右滑动打开。抽屉里有一个输入框，方便你快速记录想法、提醒或其他信息。每当你输入一条内容，就会在收件箱中生成一张背面朝上的卡片。除此之外，超过截止日期的事项、没有关联行动的项目，以及失去等待条件的等待行动，也都会以背面朝上的卡片出现在收件箱中。\n点击“回顾”按钮即可逐一处理这些卡片。回顾功能会一次显示一张卡片，让你决定如何处理。现在请打开抽屉，使用回顾功能，为那个没有关联行动的示例项目添加一项关联行动。"
  },
  "tutorial.t8.title": {
    en: "8 Tutorial Final: Habits",
    "zh-Hans": "8 教程终章：习惯"
  },
  "tutorial.t8.notes": {
    en: "None of this organizational system would work without habits. Habits are here defined as an automatic behaviour which is triggered by a cue. For example, when you here the notification sound on your cellphone, you automatically reach to check your text messages. The Getting Things Done system requires you to make a habit of checking your contextual lists when you're in the right context, as well as regularly submitting and reviewing items in your intray.\nThis app has a robust habit tracking system which helps you build the habits you want. Go to the habit lane and try to create your own habit. Remember to enter a cue in the box. Alternatively, you can use the hook icon to make another habit the cue for your new habit.",
    "zh-Hans": "没有习惯，这套组织系统就无法真正发挥作用。这里所说的“习惯”，是指由提示（cue）触发的自动行为。例如，当你听到手机通知铃声时，就会下意识地拿起手机查看消息。《搞定》（Getting Things Done）系统要求你养成这样的习惯：当处于相应情境时查看情境清单，并定期把事项放进收件箱，再通过回顾进行整理。\n本应用提供了完整的习惯追踪系统，帮助你培养想养成的习惯。请前往习惯列表，尝试创建一个属于自己的习惯。记得在输入框中填写提示（cue）。你也可以使用挂钩图标，把另一个习惯设为这个新习惯的提示（cue）。"
  },
  "tutorial.tp.title": {
    en: "Sample stalled project.",
    "zh-Hans": "示例停滞项目"
  },
  "tutorial.tp.notes": {
    en: "This project is a sample project intended for use in the tutorial. Its purpose is to get caught in the daily review during step 7 of the tutorial.",
    "zh-Hans": "这是一个用于教程的示例项目，用途是在教程第 7 步的回顾中被捕获。"
  },
  "tutorial.tr.title": {
    en: "Tutorial",
    "zh-Hans": "教程"
  },
  "tutorial.tr.notes": {
    en: "This project is a tutorial on how to use this app. Each of its linked actions is a different stage in the tutorial. You can see them listed below. You can also see these actions listed in the red and yellow lanes when you leave this page.",
    "zh-Hans": "这个项目就是本应用的使用教程。每一项关联行动都对应教程中的一个步骤，你可以在下方看到它们。离开这个页面后，也可以在红色和黄色列表中找到这些行动。"
  },

  "advanced.bundleDescription": { en: "Temptation bundling pairs something you enjoy with the thing you’re doing: allow yourself the treat only while (or right after) doing this. e.g. “Only my favorite podcast while running.”", "zh-Hans": "诱惑捆绑把你喜欢的事和正在做的事绑在一起：只有在做这件事的时候（或刚做完）才允许自己享受那个奖励。例如“只有跑步的时候才听我最喜欢的播客”。" },

// ⚑ Dev aid, deliberately loud. A missing key used to be the silent failure that
// makes a partly-translated app look BROKEN rather than merely incomplete: the
// label renders empty and nobody can tell whether the string is missing or the
// feature is. This returns the key itself, which is ugly on purpose and instantly
// greppable.
function t(key){
  const entry = STRINGS[key];
  if (!entry) return key;
  return entry[currentLocale()] || entry.en || key;
}
// Same lookup for a specific locale — used by the language picker, which has to
// show each language in its OWN language rather than in the current one.
function tIn(key, locale){
  const entry = STRINGS[key];
  if (!entry) return key;
  return entry[locale] || entry.en || key;
}
function setLocale(id){
  if (!LOCALES.some(function(l){ return l.id === id; })) return;
  state.locale = id;
  Storage.set(LOCALE_KEY, id);
  document.documentElement.setAttribute("lang", id);
  applyLocale();
}
// Everything that has to be redrawn when the language changes. The lane names,
// the info blocks, the FAB menu, the badges and the placeholders are all baked
// into markup at RENDER time from the tables rebuilt above — so re-rendering is
// the whole update; there is no live-binding to keep in sync.
//
// ⚠ The names called here (renderShell, renderTabLabels, renderLane, ALL_LANES,
// updateLaneVisibility, renderScreen, renderTray) are all function/var
// declarations in the shared IIFE scope and hoisted, so calling them from this
// early-stapled file is safe AT CALL TIME — this only ever runs from a click,
// long after boot(). The typeof guards are belt-and-braces for the very first
// language read during boot, before those are defined.
function applyLocale(){
  if (typeof rebuildStringTables === "function") rebuildStringTables();
  // Tutorial cards carry their own translatable text (seedTutorial) — re-stamp
  // it BEFORE the lanes re-render below, or they'd repaint in the old language.
  if (typeof restampTutorialCards === "function") restampTutorialCards();
  // Starter-kit contexts/habits carry their own seedKey (seedData) — restamp
  // them the same way, before the lanes re-render below.
  if (typeof restampSeedDefaults === "function") restampSeedDefaults();
  if (typeof renderShell === "function") renderShell();
  if (typeof renderTabLabels === "function") renderTabLabels();
  if (typeof renderSwUpdateBannerLabels === "function") renderSwUpdateBannerLabels();
  // Desktop round: the header's Language/Background dropdowns carry their own
  // labels in their own language, and setLocale knows nothing about them
  // otherwise (trap T12).
  if (typeof renderHeaderWidgets === "function") renderHeaderWidgets();
  if (typeof renderLane === "function" && typeof ALL_LANES !== "undefined"){
    ALL_LANES.forEach(renderLane);
  }
  if (typeof updateLaneVisibility === "function") updateLaneVisibility();
  if (state.screen && typeof renderScreen === "function") renderScreen();
  if (state.trayOpen && typeof renderTray === "function") renderTray(true);
}

// =========================================================
// BAKED SURFACE TEXTURES — the two photographic desks (user-supplied)
//
// Everything else in the picker is DRAWN at boot by surface.js, which is the
// better trick and stays. These two are photographs, so they are baked: real
// wood has figure — knots, medullary rays, the mirrored bookmatch in a veneer —
// that a ring function does not produce and should not pretend to.
//
// PROVENANCE. Poly Haven 4K PBR sets, supplied by the user. Only the DIFFUSE
// map is used; the displacement, normal and roughness maps in those packs are
// for 3D rendering and have no meaning on a flat CSS background. The source
// packs are ~187 MB and are deliberately NOT in the repo (.gitignore:
// *.blend.zip) — git history cannot be trimmed afterwards, and the app never
// loads them. What ships is only what you see here.
//
// PIPELINE, so this can be redone rather than reverse-engineered: 4096px
// diffuse -> Chromium canvas, high-quality downscale to 512 -> per-pixel
// luminance scale and slight desaturation -> JPEG at q0.72 -> data URI. There
// is no Pillow on the build machine; the browser's own resampler and encoder do
// the work. Tiling is safe because Poly Haven's maps are seamless by
// construction, and downscaling preserves that.
//
// ⚑ dark_wood is DARKENED to x0.50 luminance (user: "darken the darkwood").
// At full brightness it fought the near-black palette every other surface uses.
// rosewood ships AS SHOT (user: "keep the rose wood as is") — it is meant to be
// the bright one.
//
// ⚑ stained_pine was supplied too and is NOT included: its plank seams cut
// strong horizontal lines behind the cards. Available if wanted.
//
// Size: about 67 KB of the build, which is the whole reason these are 512px
// JPEGs rather than the 4096px PNGs they started as.
// =========================================================
