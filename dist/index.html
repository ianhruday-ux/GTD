  // =========================================================
  // BOOT
  // =========================================================
  // =========================================================
  // CHUNK 6 (§4.8a): the capture drawer (intray). A left drawer over the
  // lanes for frictionless capture — capture is the first job, so it
  // auto-opens on launch (even when empty). Captures land in gtd_tray as
  // stray thoughts; the daily review (chunk 6b) is where they get sorted.
  // Opening/closing changes nothing on the main screen — closing is a cancel.
  // =========================================================
  const TRAY_INFO = "A holding pen for stray thoughts. Try sorting through it once a day — an empty intray means nothing's slipping through the cracks.";
  function loadTray(){ return Storage.getJSON("gtd_tray", []); }
  function saveTray(){ Storage.setJSON("gtd_tray", state.tray); }
  // The eye toggle glyph (user follow-up). Crossed eye = captures are hidden
  // (tap to reveal); open eye = revealed (tap to hide). Inline SVG so the
  // "eye with a cross through it" renders identically everywhere — no emoji
  // eye-off exists cross-platform.
  function eyeIconHtml(revealed){
    const base = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/>';
    return base + (revealed ? "" : '<line x1="3" y1="3" x2="21" y2="21"/>') + '</svg>';
  }
  // A tray card. Captures are REDACTED by default (user follow-up): a sealed
  // pitch-black bar, unreadable and with no discard ✕, exactly like the
  // review's redaction. The drawer's reveal toggle un-seals them.
  function trayCardHtml(item, revealed){
    if (!revealed) return '<div class="tray-card tray-card-redacted"><span class="tray-card-redaction" aria-hidden="true"></span></div>';
    return '<div class="tray-card">' +
      '<span class="tray-card-text">' + escapeHtml(item.text) + '</span>' +
      '<button type="button" class="icon-btn" data-action="tray-delete" data-id="' + item.id + '" title="Discard">&times;</button>' +
    '</div>';
  }
  // The drawer's Review button (chunk 6b, §4.8b) — the entry point to the
  // review surface. The badge counts EVERY open loop across all lanes (not
  // just captures). It does NOT subtract "Not now" deferrals: those now reset
  // the moment the review reopens (user follow-up), so the badge reflects what
  // the next open will actually show.
  function trayReviewBtnHtml(){
    const n = computeOpenLoops().length;
    return '<button type="button" class="tray-review-btn" data-action="open-review">' +
      '<span>&#128269; Review</span>' + (n ? '<span class="tray-review-count">' + n + '</span>' : '') +
    '</button>';
  }
  // ⚑ The drawer lists DERIVED loops too, not just captures (user): "the empty
  // label shows when there are no captures, but it's not strictly true. Stalled
  // projects and orphaned actions should show up as redacted cards in the list
  // which can be revealed."
  //
  // The Review button's badge has always counted every open loop, so a drawer
  // that said "nothing slipping through the cracks" directly above a badge
  // reading 3 was contradicting itself. Now the list shows what the badge counts.
  //
  // These are NOT captures and behave differently, deliberately:
  //   · no ✕ — a stalled project is not a stray thought you can discard; the
  //     way to clear it is to give it a way forward, which is the review's job
  //   · not tappable, revealed or not — same ruling as the review's own
  //     redaction (§4.8b): cherry-picking blind makes the discipline decorative
  //   · revealed, they name the kind ("stalled project"), because the title
  //     alone does not say why it is in the list
  // ⚑ Past-due items are deliberately NOT included: they are time-driven, they
  // already carry their own bar and chip in the lanes, and putting them here
  // would make the drawer a second review rather than a way in to the first.
  function trayDerivedLoops(){
    return computeOpenLoops().filter(function(l){
      return l.kind === "stalled" || l.kind === "orphaned";
    });
  }
  // ⚑ Plain descriptions, not the internal kind names (user: the jargon pass).
  // "no way forward" is the same wording the review card already uses for a
  // stalled project, so the drawer and the review say the same thing.
  const TRAY_LOOP_LABEL = { stalled: "no way forward", orphaned: "waiting on something gone" };
  function trayLoopCardHtml(loop, revealed){
    if (!revealed){
      return '<div class="tray-card tray-card-redacted tray-card-loop">' +
        '<span class="tray-card-redaction" aria-hidden="true"></span></div>';
    }
    return '<div class="tray-card tray-card-loop">' +
      '<span class="tray-card-text">' + escapeHtml(loop.task.title || "") +
        ' <span class="tray-card-kind">' + TRAY_LOOP_LABEL[loop.kind] + '</span>' +
      '</span></div>';
  }
  function trayListHtml(){
    const items = state.tray || [];
    const loops = trayDerivedLoops();
    const revealed = !!state.trayReveal;
    let list;
    if (items.length || loops.length){
      const cards = items.map(function(it){ return trayCardHtml(it, revealed); }).join("") +
        loops.map(function(l){ return trayLoopCardHtml(l, revealed); }).join("");
      const toggle = '<div class="tray-list-head">' +
        '<button type="button" class="tray-reveal-btn" data-action="tray-reveal" title="' + (revealed ? "Hide" : "Reveal") + '">' +
          eyeIconHtml(revealed) + '<span>' + (revealed ? "Hide" : "Reveal") + '</span>' +
        '</button></div>';
      list = toggle + '<div class="tray-list">' + cards + '</div>';
    } else {
      list = '<div class="tray-empty">Empty for now — nothing slipping through the cracks.</div>';
    }
    return trayReviewBtnHtml() + list;
  }
  // Update just the card list in an already-open drawer — adding/removing a
  // capture must not rebuild (and re-slide) the whole drawer (user: the jump).
  function refreshTrayList(){
    const wrap = qs(".tray-scroll");
    if (wrap) wrap.innerHTML = trayListHtml(); else renderTray();
  }
  function renderTray(skipOpen){
    const root = qs("#tray-root");
    if (!root) return;
    const list = '<div class="tray-scroll">' + trayListHtml() + '</div>';
    root.innerHTML =
      '<div class="tray-backdrop" data-action="close-tray"></div>' +
      '<div class="tray-drawer">' +
        '<div class="tray-head">' +
          '<span class="tray-title">Intray</span>' +
          '<span style="flex:1"></span>' +
          '<button type="button" class="icon-btn" data-action="tray-info" title="What is this?">&#9432;</button>' +
          '<button type="button" class="icon-btn" data-action="close-tray" title="Close">&times;</button>' +
        '</div>' +
        '<div class="tray-info-panel" hidden>' + escapeHtml(TRAY_INFO) + '</div>' +
        '<div class="tray-capture">' +
          '<input type="text" id="tray-input" placeholder="Capture a thought…" autocomplete="off">' +
          '<button type="button" data-action="tray-add" title="Add">+</button>' +
        '</div>' +
        list +
      '</div>';
    // Force the -100% start state to commit BEFORE adding .open, or the
    // browser collapses both into one paint and the drawer snaps open with no
    // slide (worst at launch auto-open, user). The reflow read guarantees it.
    // skipOpen leaves the drawer parked off-screen at -100% so a finger-follow
    // swipe can drag it in (bindDrawerSwipe).
    const backdrop = qs(".tray-backdrop"), drawer = qs(".tray-drawer");
    if (skipOpen) return;
    if (drawer){ void drawer.offsetWidth; drawer.classList.add("open"); }
    if (backdrop) backdrop.classList.add("open");
  }
  function openTray(){
    state.trayOpen = true;
    state.trayReveal = false; // captures start sealed every time the drawer opens (user follow-up)
    renderTray();
    const input = qs("#tray-input"); if (input) input.focus();
  }
  function closeTray(){
    state.trayOpen = false;
    const r = qs("#tray-root");
    const drawer = qs(".tray-drawer"), backdrop = qs(".tray-backdrop");
    if (!drawer){ if (r) r.innerHTML = ""; return; }
    drawer.classList.remove("open");            // slide out
    if (backdrop) backdrop.classList.remove("open");
    setTimeout(function(){ if (r && !state.trayOpen) r.innerHTML = ""; }, 300); // clears after the .28s slide-out
  }
  // Finger-follow swipe on the intray drawer — the same drag-and-snap mechanic
  // as the calendar month swipe (user: "works great, no browser issues"). Two
  // gestures: drag the OPEN drawer left to dismiss it, and drag in from the
  // LEFT EDGE to open it. The drawer tracks the finger and snaps on release.
  let drawerDrag = null;
  const DRAWER_EDGE = 26;
  function bindDrawerSwipe(){
    document.addEventListener("touchstart", function(e){
      if (drawerDrag || e.touches.length !== 1) return;
      if (qs(".choice-dialog-backdrop")) return; // a dialog owns the gesture
      const t = e.touches[0];
      if (state.trayOpen){
        const drawer = qs(".tray-drawer"); if (!drawer) return;
        drawerDrag = { mode: "close", startX: t.clientX, startY: t.clientY, width: drawer.getBoundingClientRect().width, drawer: drawer, backdrop: qs(".tray-backdrop"), decided: false, horizontal: false };
      } else if (!state.screen && t.clientX <= DRAWER_EDGE){
        renderTray(true); // build it parked off-screen at -100%, ready to drag in
        const drawer = qs(".tray-drawer"); if (!drawer) return;
        drawerDrag = { mode: "open", startX: t.clientX, startY: t.clientY, width: drawer.getBoundingClientRect().width, drawer: drawer, backdrop: qs(".tray-backdrop"), decided: false, horizontal: false };
      }
    }, { passive: true });
    document.addEventListener("touchmove", function(e){
      if (!drawerDrag) return;
      const t = e.touches[0];
      const dx = t.clientX - drawerDrag.startX, dy = t.clientY - drawerDrag.startY;
      if (!drawerDrag.decided){
        if (Math.abs(dx) <= 8 && Math.abs(dy) <= 8) return;
        drawerDrag.decided = true;
        drawerDrag.horizontal = Math.abs(dx) > Math.abs(dy);
        if (!drawerDrag.horizontal){ cancelDrawerDrag(); return; } // vertical → let the drawer scroll
        drawerDrag.drawer.style.transition = "none";
        if (drawerDrag.backdrop) drawerDrag.backdrop.style.transition = "none";
      }
      if (!drawerDrag.horizontal) return;
      e.preventDefault(); // claim the horizontal gesture
      const w = drawerDrag.width;
      const offset = drawerDrag.mode === "close"
        ? Math.max(-w, Math.min(0, dx))
        : Math.max(-w, Math.min(0, -w + Math.max(0, dx)));
      drawerDrag.drawer.style.transform = "translateX(" + offset + "px)";
      if (drawerDrag.backdrop) drawerDrag.backdrop.style.opacity = String(Math.max(0, Math.min(1, 1 + offset / w)));
    }, { passive: false });
    function endDrawer(e){
      if (!drawerDrag) return;
      const dd = drawerDrag; drawerDrag = null;
      dd.drawer.style.transition = ""; if (dd.backdrop) dd.backdrop.style.transition = "";
      const clearInline = function(){ dd.drawer.style.transform = ""; if (dd.backdrop) dd.backdrop.style.opacity = ""; };
      const teardown = function(){ clearInline(); setTimeout(function(){ if (!state.trayOpen){ const r = qs("#tray-root"); if (r) r.innerHTML = ""; } }, 300); };
      if (!dd.decided || !dd.horizontal){
        if (dd.mode === "open") teardown(); else clearInline();
        return;
      }
      const dx = (e.changedTouches ? e.changedTouches[0].clientX : dd.startX) - dd.startX;
      const threshold = Math.max(60, dd.width * 0.33);
      if (dd.mode === "close"){
        if (dx < -threshold){ closeTray(); clearInline(); }                 // commit close
        else { dd.drawer.classList.add("open"); if (dd.backdrop) dd.backdrop.classList.add("open"); clearInline(); } // snap back open
      } else {
        if (dx > threshold){                                               // commit open
          state.trayOpen = true; state.trayReveal = false;
          dd.drawer.classList.add("open"); if (dd.backdrop) dd.backdrop.classList.add("open"); clearInline();
          const inp = qs("#tray-input"); if (inp) setTimeout(function(){ inp.focus(); }, 60);
        } else { dd.drawer.classList.remove("open"); teardown(); }          // cancel open
      }
    }
    document.addEventListener("touchend", endDrawer, { passive: true });
    document.addEventListener("touchcancel", endDrawer, { passive: true });
  }
  function cancelDrawerDrag(){
    if (!drawerDrag) return;
    const dd = drawerDrag; drawerDrag = null;
    dd.drawer.style.transition = ""; if (dd.backdrop) dd.backdrop.style.transition = "";
    dd.drawer.style.transform = ""; if (dd.backdrop) dd.backdrop.style.opacity = "";
    if (dd.mode === "open"){ setTimeout(function(){ if (!state.trayOpen){ const r = qs("#tray-root"); if (r) r.innerHTML = ""; } }, 300); }
  }
  function trayAdd(text){
    text = (text || "").trim();
    if (!text) return;
    state.tray.unshift({ id: genId(), text: text, createdAt: nowMs() });
    saveTray();
    const inp = qs("#tray-input"); if (inp) inp.value = ""; // clear the box in place — no full re-render/re-slide
    refreshTrayList();
    if (inp) inp.focus(); // stays focused for the next thought
  }
  function trayDelete(id){
    state.tray = state.tray.filter(function(t){ return t.id !== id; });
    saveTray();
    refreshTrayList();
  }
  // Silent capture removal (no drawer re-render) — used when a sort chip's
  // create page saves. trayDelete would call refreshTrayList/renderTray and,
  // with the drawer closed, re-open it; this just mutates the store.
  function removeCapture(id){
    state.tray = state.tray.filter(function(t){ return t.id !== id; });
    saveTray();
  }
  function consumeCaptureForScreen(s){
    if (s && s.fromCaptureId){ removeCapture(s.fromCaptureId); s.fromCaptureId = null; }
  }

  // =========================================================
  // CHUNK 6b (§4.8b): the daily REVIEW — open loops, one at a time.
  // A redacted, one-at-a-time QUEUE (a lens, not a container) over four kinds
  // of open loop, on its own full-screen surface reached from the drawer's
  // Review button. Items stay in their lanes; tapping a revealed card opens
  // its real page and save-exiting returns here (screenStack). The queue is
  // DERIVED — recomputed on every render, never snapshotted (or we'd triage
  // ghosts, §4.8b). ⛔ Fence: no progress bar, no Next/Skip, no complete
  // screen, no streaks/reminders/snooze, no deferral history. The past-due
  // kind ships in its DEADLINE shape only; chunk 7 slots in the pseudo-action
  // CHECKBOX shape + the Calendar chip + the "it moved" banner.
  // =========================================================
  function isWaitingOrphaned(task){
    if (!task || !task.conditionId) return false;
    const pool = task.conditionKind === "next" ? state.tasks.next : state.tasks.waiting;
    if (pool.some(function(t){ return t.id === task.conditionId && !t.isGroup; })) return false;
    // chunk 8 (§10 / §4.15b): a condition on a not-yet-live event is NOT an
    // orphan — resolve it against gtd_events. A PAUSED series won't fire, so a
    // dependent on it IS shown orphaned, but reversibly (this is derived, not a
    // frozen label — it clears the moment the series is unpaused). Delete-series
    // removes the event, so its dependents fall through to the genuine-orphan
    // case below; skip-this-one keeps the same task ID and never lands here.
    const ev = findEventByTaskId(task.conditionId);
    if (ev) return !!ev.paused;
    return true;
  }
  // Dev scaffolding (the chunk-map roadmap, the QA checklist) is injected as
  // groups tagged devContext and is deliberately unlinked/actionless — the
  // LANE flag on those is expected (chunkMap.js), but they are NOT real open
  // loops and must never flood the user's review. Exclude an item whose own
  // group parent carries a devContext.
  function isDevScaffold(task){
    if (!task) return false;
    if (task.devContext) return true;
    if (!task.parent) return false;
    const groups = state.tasks.current.concat(state.tasks.next, state.tasks.waiting, state.tasks.future);
    const parent = groups.find(function(t){ return t.id === task.parent && t.isGroup; });
    return !!(parent && parent.devContext);
  }
  // The ordered queue. Past-due FIRST (§4.8b: sorts to top, revealed first),
  // then captures, then the two derived open-loop kinds LAST — stalled
  // projects and orphaned waiting actions sink to the bottom (user follow-up:
  // they're the "think about it" items, so you clear the quick wins first).
  // De-duped by id so an item that is both past-due and stalled surfaces once
  // (past-due wins, being first).
  function computeOpenLoops(){
    const loops = [];
    // Events already being asked about as a live past-due row. A series whose
    // TODAY has passed unticked is queued below as a pseudo-action; if it also
    // carries a recorded miss from an earlier day, showing both would put the
    // same series in the queue twice — the accumulation the single-slot design
    // exists to prevent. The live one wins: it is the more recent question, and
    // dealing with it is what the review is for.
    const pastDueEventIds = {};
    ["next", "current"].forEach(function(k){
      state.tasks[k].forEach(function(t){
        if (t.isGroup || isDevScaffold(t)) return;
        // chunk 7: a past-due pseudo-action is a past-due open loop too, but in
        // its CHECKBOX shape (§4.8b / §2) — not the deadline's push/complete/
        // delete menu. deadlineBarState is null for it (no deadline field), so
        // it needs its own past-due test.
        if (t.eventId){
          if (pseudoPassed(t)){
            pastDueEventIds[t.eventId] = 1;
            loops.push({ key: t.id, kind: "pastdue", laneKind: k, id: t.id, task: t, pseudo: true });
          }
          return;
        }
        const st = deadlineBarState(t);
        if (st && st.passed) loops.push({ key: t.id, kind: "pastdue", laneKind: k, id: t.id, task: t });
      });
    });
    // A repeating occurrence that went unticked and has already been rolled past
    // (user ruling). It has no lane row — the series' single pseudo-action has
    // moved on to the next date — so it is derived from the event itself rather
    // than found in a lane, and carries the EVENT id, not a task id.
    (state.events || []).forEach(function(ev){
      if (!ev.missedOcc) return;
      if (pastDueEventIds[ev.id]) return;   // already queued, once is enough
      loops.push({ key: "missed-" + ev.id, kind: "missed", id: ev.id, ev: ev, occ: ev.missedOcc });
    });
    (state.tray || []).forEach(function(c){ loops.push({ key: c.id, kind: "capture", id: c.id, text: c.text }); });
    state.tasks.current.forEach(function(t){
      if (!t.isGroup && !isDevScaffold(t) && !projectHasWayForward(t.id)) loops.push({ key: t.id, kind: "stalled", laneKind: "current", id: t.id, task: t });
    });
    state.tasks.waiting.forEach(function(t){
      if (!t.isGroup && !isDevScaffold(t) && isWaitingOrphaned(t)) loops.push({ key: t.id, kind: "orphaned", laneKind: "waiting", id: t.id, task: t });
    });
    const seen = {};
    return loops.filter(function(l){ if (seen[l.key]) return false; seen[l.key] = 1; return true; });
  }

  // --- "Not now" deferral: scoped to the currently-OPEN review (user
  //     follow-up, supersedes the §4.8b day-scoped model). A deferred item
  //     drops out for the rest of THIS viewing; closing the review and opening
  //     it again brings everything back — "defer until the next review", not
  //     "until tomorrow". The set is in-memory only; openReviewScreen clears
  //     it, so nothing needs to persist or be stamped with the app-day.
  function reviewDeferredSet(){ return state.reviewDeferred || (state.reviewDeferred = {}); }
  function deferReviewItem(key){ reviewDeferredSet()[key] = 1; }
  function reviewActiveLoops(){
    const deferred = reviewDeferredSet();
    return computeOpenLoops().filter(function(l){ return !deferred[l.key]; });
  }

  function openReviewScreen(){
    state.reviewDeferred = {}; // a fresh review always starts with everything on the table
    state.reviewShowAll = false;
    state.screen = { kind: "review", reviewView: true, taskId: null, draft: {}, reviewForm: null };
    renderScreen();
  }
  // Push the review onto the stack and open a child screen, so save-exiting
  // that child returns here and the queue recomputes (§4.8b navigation).
  function reviewOpenChild(fn){
    state.screenStack.push(state.screen);
    state.screen = null;
    fn();

        // The headings now describe the situation instead of naming it. "Stalled"

        '<div class="review-info-block"><b>When something needs a decision</b><br>' +

          '<b>Stalled project:</b> ' + escapeHtml(REVIEW_MENU_INFO.stalled) + '<br>' +

  // A redacted card: visible (you can see one more loop exists and count them)

  function reviewFormFor(s, key){ return (s.reviewForm && s.reviewForm.key === key) ? s.reviewForm : null; }

  // The two-field variant, for adding a Waiting action to a stalled project.

  function reviewWaitingFormHtml(s, key){

  function reviewCardHtml(l, s){
    const invalid = !!(s.reviewForm && s.reviewForm.key === l.key && s.reviewForm.invalid);
    let bodyHtml = "", menuHtml = "";
    if (l.kind === "capture"){
      bodyHtml = '<div class="review-card-title">' + escapeHtml(l.text) + '</div>';
      menuHtml =
        '<div class="review-sort-chips">' +
          reviewMenuBtn("review-sort", "Next", ' data-target="next" data-key="' + l.key + '"') +
          reviewMenuBtn("review-sort", "Waiting", ' data-target="waiting" data-key="' + l.key + '"') +
          reviewMenuBtn("review-sort", "Project", ' data-target="current" data-key="' + l.key + '"') +
          reviewMenuBtn("review-sort", "Future", ' data-target="future" data-key="' + l.key + '"') +
          reviewMenuBtn("review-sort", "Habit", ' data-target="habit" data-key="' + l.key + '"') +
          reviewMenuBtn("review-sort", "Note", ' data-target="notes" data-key="' + l.key + '"') +
          reviewMenuBtn("review-sort", "Calendar", ' data-target="calendar" data-key="' + l.key + '"') + // chunk 7 (§4.8b): the sixth chip
        '</div>' +
        '<div class="review-menu-row">' + reviewNotNowBtn(l.key) + '</div>';
      return '<div class="review-card review-card-capture">' + bodyHtml + menuHtml + '</div>';
    }
    // A rolled-past repeating occurrence (user ruling). Handled before the shared
    // path below because it has NO lane row to read a title or a bar from — it is
    // the event plus a date. Tapping through goes to the event's page.
    //
    // The menu is the past-due pseudo-action's, minus anything that would act on
    // the wrong occurrence: you cannot push a date that is already behind you,
    // and Delete here must clear THIS miss, not the live series.
    if (l.kind === "missed"){
      const when = dateStrToDate(l.occ).toLocaleDateString(undefined,
        { weekday: "long", day: "numeric", month: "long" });
      bodyHtml =
        '<button type="button" class="review-card-open" data-action="review-open-event" data-id="' + l.id + '">' +
          '<span class="review-card-title">' + escapeHtml(effTitle(l.ev, l.occ)) + '</span>' +
          '<span class="review-card-note">⚠ went by on ' + escapeHtml(when) + ' without being ticked</span>' +
        '</button>';
      menuHtml =
        '<button type="button" class="review-menu-btn" data-action="review-missed-done" data-id="' + l.id + '">&#10003; I did it</button>' +
        '<button type="button" class="review-menu-btn" data-action="review-missed-clear" data-id="' + l.id + '">Let it go</button>' +
        reviewNotNowBtn(l.key);
      return '<div class="review-card">' + bodyHtml + menuHtml + '</div>';
    }
    // Derived kinds share a tap-through title (opens the real page) + a
    // context line, then a per-kind decision menu. A pseudo-action taps
    // through to its EVENT page (§4.14/§4.15), not an action page.
    const openAttr = (l.pseudo)
      ? ' data-action="review-open-event" data-id="' + l.task.eventId + '"'
      : ' data-action="review-open" data-lane="' + l.laneKind + '" data-id="' + l.id + '"';
    bodyHtml = '<button type="button" class="review-card-open"' + openAttr + '>' +
      '<span class="review-card-title">' + escapeHtml(l.task.title || "") + '</span>';
    if (l.kind === "pastdue"){
      bodyHtml += l.pseudo ? pseudoBarHtml(l.task) : deadlineBarHtml(l.task);
    } else if (l.kind === "stalled"){
      bodyHtml += '<span class="review-card-note">⚠ no way forward</span>';
    } else if (l.kind === "orphaned"){
      bodyHtml += '<span class="review-card-note cue-orphaned-text">🪝 After ' + escapeHtml(l.task.conditionLabel || "a deleted item") + '</span>';
    }
    bodyHtml += '</button>';

    const form = reviewFormFor(s, l.key);
    if (l.kind === "pastdue" && l.pseudo){
      // §2: the pseudo-action shape of the past-due kind is a CHECKBOX, not the
      // deadline menu — you cannot "push" an event's date from here (it is
      // rescheduled on its own page), only tick it done or defer it.
      // ⚑ QA #13: Delete joins Mark done. They look interchangeable but they
      // are not — completing files the event into Completed, which is right for
      // something you did and wrong for something that simply died. Without a
      // delete here, the only way to clear a dead past-due event was to record
      // it as an accomplishment. Routed through the event (not the lane row):
      // deleting the row alone leaves the event live and the sweep re-mints it.
      menuHtml =
        '<button type="button" class="review-menu-btn" data-action="review-complete" data-lane="' + l.laneKind + '" data-id="' + l.id + '">&#10003; Mark done</button>' +
        '<button type="button" class="review-menu-btn danger" data-action="review-delete-event" data-id="' + l.id + '">&#128465; Delete</button>' +
        reviewNotNowBtn(l.key);
    } else if (l.kind === "pastdue"){
      if (form && form.type === "date"){
        menuHtml = reviewInlineFormHtml("", "date", "review-pushdate-save", "Save", (l.task.deadline && l.task.deadline.date) || "", invalid);
      } else {
        menuHtml =
          reviewMenuBtn("review-form-start", "Push the date", ' data-key="' + l.key + '" data-type="date"') +
          reviewMenuBtn("review-complete", "Complete it", ' data-lane="' + l.laneKind + '" data-id="' + l.id + '"') +
          reviewMenuBtn("review-delete", "Delete it", ' data-lane="' + l.laneKind + '" data-id="' + l.id + '"', true) +
          reviewNotNowBtn(l.key);
      }
    } else if (l.kind === "stalled"){
      if (form && form.type === "text"){
        menuHtml = reviewInlineFormHtml("What's the very next physical action?", "text", "review-addnext-save", "Add", "", invalid);
      } else if (form && form.type === "waiting"){
        // ⚑ Two fields, not one (user: stalled projects need a waiting action
        // here too). A Waiting action is invalid without something to wait ON
        // (§4.2), so a single title box would create a broken row that the
        // review would immediately re-report as orphaned — the exact loop this
        // menu exists to close. The second field is free text rather than the
        // condition picker: the picker is a whole sub-view, and the review's
        // character is one decision, inline, without leaving.
        menuHtml = reviewWaitingFormHtml(s, l.key);
      } else {
        menuHtml =
          reviewMenuBtn("review-form-start", "Add a next action", ' data-key="' + l.key + '" data-type="text"') +
          reviewMenuBtn("review-form-start", "Add a waiting action", ' data-key="' + l.key + '" data-type="waiting"') +
          reviewMenuBtn("review-someday", "Move to Someday", ' data-id="' + l.id + '"') +
          reviewMenuBtn("review-complete", "Complete it", ' data-lane="current" data-id="' + l.id + '"') +
          reviewMenuBtn("review-delete", "Delete it", ' data-lane="current" data-id="' + l.id + '"', true) +
          reviewNotNowBtn(l.key);
      }
    } else if (l.kind === "orphaned"){
      if (form && form.type === "text"){
        menuHtml = reviewInlineFormHtml("Waiting for…", "text", "review-freetext-save", "Save", "", invalid);
      } else {
        menuHtml =
          reviewMenuBtn("review-open", "Re-point the condition →", ' data-lane="waiting" data-id="' + l.id + '"') +
          reviewMenuBtn("review-form-start", "Replace with free text", ' data-key="' + l.key + '" data-type="text"') +
          reviewMenuBtn("review-promote", "Promote to Next", ' data-id="' + l.id + '"') +
          reviewMenuBtn("review-complete", "Complete", ' data-lane="waiting" data-id="' + l.id + '"') +
          reviewMenuBtn("review-delete", "Delete", ' data-lane="waiting" data-id="' + l.id + '"', true) +
          reviewNotNowBtn(l.key);
      }
    }
    return '<div class="review-card review-card-' + l.kind + '">' + bodyHtml + '<div class="review-menu">' + menuHtml + '</div></div>';
  }

  function reviewBodyHtml(s){
    const active = reviewActiveLoops();
    const deferredCount = computeOpenLoops().length - active.length;
    let html = '<div class="screen-body review-body">' + reviewInfoPanelHtml();
    if (!active.length){
      html += (deferredCount > 0)
        ? '<div class="review-end review-end-deferred"><div class="review-end-big">' + deferredCount + ' deferred.</div>' +
            '<div class="review-end-sub">You saw everything. These are waiting on you — they’ll be back next time you open the review.</div></div>'
        : '<div class="review-end review-end-empty"><div class="review-end-big">All clear.</div>' +
            '<div class="review-end-sub">Nothing slipping through the cracks.</div></div>';
      return html + '</div>';
    }
    const showAll = !!state.reviewShowAll;
    if (active.length > 1){
      html += '<div class="review-toolbar"><span class="review-remaining">' + active.length + ' to review</span>' +
        '<button type="button" class="btn btn-ghost btn-small" data-action="review-toggle-all">' + (showAll ? "One at a time" : "Show all") + '</button></div>';
    }
    active.forEach(function(l, i){
      html += (showAll || i === 0) ? reviewCardHtml(l, s) : reviewRedactionHtml();
    });
    return html + '</div>';
  }

  // --- Review decision actions. Each mutates live state then re-renders the
  //     review, which recomputes the derived queue (§4.8b: resolved items drop
  //     out, edited-but-unfixed stay). No queue snapshot.
  function reviewFindTask(id){
    const kinds = ["next", "waiting", "current", "future"];
    for (let i = 0; i < kinds.length; i++){
      const t = state.tasks[kinds[i]].find(function(x){ return x.id === id; });
      if (t) return { kind: kinds[i], task: t };
    }
    return null;
  }
  // Which text sub-form is open: a Current project → "Add a next action";
  // a Waiting action → "Replace with free text".
  function reviewFindLoopKind(id){
    const found = reviewFindTask(id);
    return (found && found.kind === "current") ? "stalled" : "orphaned";
  }
  function reviewFormInput(){ return qs("#review-form-input"); }
  function reviewMarkFormInvalid(){ if (state.screen && state.screen.reviewForm){ state.screen.reviewForm.invalid = true; renderScreen(); const inp = reviewFormInput(); if (inp) inp.focus(); } }
  function reviewSavePushDate(){
    const s = state.screen; if (!s || !s.reviewForm) return;
    const inp = reviewFormInput(); const val = inp ? inp.value : "";
    if (!val){ reviewMarkFormInvalid(); return; }
    const found = reviewFindTask(s.reviewForm.key);
    if (found){
      const time = (found.task.deadline && found.task.deadline.time) || null;
      // keep the time; push only the day (§4.8b inline exec). Goes through the
      // shared helper so the bar restarts and the push is counted exactly as it
      // would be from the item's own page (QA #23).
      applyDeadlineChange(found.task, { date: val, time: time });
      saveTasksLocal(found.kind); renderLane(found.kind);
    }
    s.reviewForm = null; renderScreen();
  }
  function reviewSaveAddNext(){
    const s = state.screen; if (!s || !s.reviewForm) return;
    const inp = reviewFormInput(); const val = (inp ? inp.value : "").trim();
    if (!val){ reviewMarkFormInvalid(); return; }
    const pid = s.reviewForm.key;
    createTask("next", { title: val, linkedProjectId: pid }).then(function(){ s.reviewForm = null; renderScreen(); });
  }
  // Add a Waiting action to a stalled project (user). Both fields are required:
  // the title, and something to wait on — a Waiting action without either is
  // the orphaned state the review reports, so creating one here would be the
  // review manufacturing its own next finding.
  function reviewSaveAddWaiting(){
    const s = state.screen; if (!s || !s.reviewForm) return;
    const t = qs("#review-form-input"), w = qs("#review-form-input2");
    const title = (t ? t.value : "").trim();
    const when = (w ? w.value : "").trim();
    // Keep what was typed across the re-render, or the valid field is wiped
    // while the user fixes the other one.
    s.reviewForm.value = title; s.reviewForm.value2 = when;
    if (!title || !when){
      s.reviewForm.invalidField = !title ? "title" : "when";
      renderScreen();
      const el = qs(!title ? "#review-form-input" : "#review-form-input2");
      if (el) el.focus();
      return;
    }
    const pid = s.reviewForm.key;
    createTask("waiting", { title: title, whenText: when, linkedProjectId: pid })
      .then(function(){ s.reviewForm = null; renderScreen(); });
  }
  // "I did it" — you did the thing and forgot to tick it, which is the case the
  // user named. Records the completion against the occurrence's own date, so it
  // keeps its dimmed mark on the calendar for the day it actually happened
  // rather than today, and clears the miss.
  function reviewMissedDone(eventId){
    const ev = findEvent(eventId);
    if (!ev) return;
    if (ev.missedOcc){
      ev.completedOccs = ev.completedOccs || [];
      if (ev.completedOccs.indexOf(ev.missedOcc) === -1) ev.completedOccs.push(ev.missedOcc);
      ev.missedOcc = null;
    }
    saveEvents();
    renderLane("next"); renderLane("waiting");
    if (state.screen) state.screen.reviewForm = null;
    renderScreen();
  }
  // "Let it go" — it did not happen and that is fine. Clears the miss WITHOUT
  // recording a completion, so it never counts as something you achieved.
  // ⚑ No confirm dialog: this destroys nothing (the series is untouched and the
  // occurrence was already rolled past), so the standing rule about destructive
  // actions does not apply.
  function reviewMissedClear(eventId){
    const ev = findEvent(eventId);
    if (!ev) return;
    ev.missedOcc = null;
    saveEvents();
    if (state.screen) state.screen.reviewForm = null;
    renderScreen();
  }
  function reviewSaveFreeText(){
    const s = state.screen; if (!s || !s.reviewForm) return;
    const inp = reviewFormInput(); const val = (inp ? inp.value : "").trim();
    if (!val){ reviewMarkFormInvalid(); return; }
    const found = reviewFindTask(s.reviewForm.key);
    if (found && found.kind === "waiting"){
      found.task.whenText = val;
      found.task.conditionId = null; found.task.conditionKind = null; found.task.conditionLabel = null;
      saveTasksLocal("waiting"); renderLane("waiting");
    }
    s.reviewForm = null; renderScreen();
  }
  function reviewComplete(lane, id){
    if (lane === "current") completeProject("current", id); else completeTask(lane, id);
    if (state.screen) state.screen.reviewForm = null;
    renderScreen();
  }
  function reviewDelete(lane, id){
    const found = reviewFindTask(id);
    const title = found ? (found.task.title || "this") : "this";
    openConfirmDialog("Delete “" + title + "” for good?", [
      { label: "Delete", style: "danger", action: function(){ deleteTask(lane, id); if (state.screen) state.screen.reviewForm = null; renderScreen(); } },
      { label: "Cancel", action: function(){} }
    ]);
  }
  // QA #13. The id is the pseudo-action's task ID, which IS the event's taskId
  // (§4.14a) — that stability is exactly what lets the review address the event
  // without carrying a second identifier.
  function reviewDeleteEvent(taskId){
    const ev = findEventByTaskId(taskId);
    if (!ev){ renderScreen(); return; }
    confirmDeleteEvent(ev, function(){
      if (state.screen) state.screen.reviewForm = null;
      renderScreen();
    });
  }
  function reviewSortCapture(target, key){
    const capture = (state.tray || []).find(function(t){ return t.id === key; });
    if (!capture) { renderScreen(); return; }
    const text = capture.text;
    reviewOpenChild(function(){
      if (target === "calendar"){ // chunk 7 (§4.8b): open the calendar prefilled, today selected
        openCalendarScreen({ name: text, fromCaptureId: key });
      } else if (target === "notes"){ openNoteScreen(null, { title: text, fromCaptureId: key }); }
      else { openScreen(target, null, { title: text }); if (state.screen) state.screen.fromCaptureId = key; }
    });
  }

  // =========================================================
  // CHUNK 6 (§4.10): the settings surface, behind the header ⋯. Holds the
  // app-wide destructive control (Clear all app data — today's Reset);
  // Export/Import join it in chunk 8. Lane-scoped Completed clearing stays put.
  // =========================================================
  function clearAllAppData(){
    // A true clear: every gtd_ key (data + injected-flag bookkeeping). gtddev_
    // keys (snapshot, drag-log settings) survive, like Reset always has.
    Storage.keys().forEach(function(key){ if (key.indexOf("gtd_") === 0) Storage.remove(key); });
    window.location.reload();
  }
  // ▲ POST-SPRINT (§P1): the settings surface is a DROPDOWN anchored under the
  // header ⋯, not a modal sheet. A modal is a room you have to leave; settings
  // here are small, frequent, and mostly one tap, so the menu opens over the
  // desk and dismisses on any outside tap. Nested panels (Background) push into
  // the same dropdown rather than opening a second layer.
  let settingsPanel = "root";
  function settingsRootHtml(){
    const surf = SURFACES[currentSurfaceId()] || SURFACES[DEFAULT_SURFACE];
    return (
      '<button type="button" class="settings-item" data-action="export-data">' +
        '<span>&#11014;</span><span class="si-label">Export a backup</span></button>' +
      '<button type="button" class="settings-item" data-action="import-data">' +
        '<span>&#11015;</span><span class="si-label">Import a backup</span></button>' +
      '<div class="settings-sep"></div>' +
      '<button type="button" class="settings-item" data-action="settings-backgrounds">' +
        '<span>&#127912;</span><span class="si-label">Background</span>' +
        '<span class="si-value">' + escapeHtml(surf.label) + '</span><span class="si-caret">&#8250;</span></button>' +
      // Listed, not hidden: the slot is real and the work is scheduled, so the
      // menu says so rather than pretending the feature doesn't exist.
      '<button type="button" class="settings-item disabled" data-action="settings-language" disabled>' +
        '<span>&#127760;</span><span class="si-label">Language</span>' +
        '<span class="si-value">not built yet</span></button>' +
      '<div class="settings-sep"></div>' +
      '<button type="button" class="settings-item danger" data-action="clear-all-data">' +
        '<span>&#8634;</span><span class="si-label">Restore app to defaults</span></button>'
    );
  }
  function settingsBackgroundsHtml(){
    const cur = currentSurfaceId();
    let out =
      '<button type="button" class="settings-item settings-back" data-action="settings-root">' +
        '<span>&#8249;</span><span class="si-label">Background</span></button>' +
      '<div class="settings-sep"></div>';
    Object.keys(SURFACES).forEach(function(id){
      out +=
        '<button type="button" class="settings-item" data-action="settings-pick-bg" data-bg="' + id + '">' +
          '<span class="settings-swatch" style="' + surfaceSwatchStyle(id) + '"></span>' +
          '<span class="si-label">' + escapeHtml(SURFACES[id].label) + '</span>' +
          (id === cur ? '<span class="settings-check">&#10003;</span>' : "") +
        '</button>';
    });

  // =========================================================
  // EXPORT / IMPORT (chunk 8, §2). The user-facing backup — a different feature
  // from the dev snapshot (§12.3), but it shares the "every gtd_ key, verbatim"
  // serialization. The backup MUST carry events/series (a top-level entity as
  // of chunk 7) — it does, because it sweeps ALL gtd_ keys, gtd_events included.
  // Import REPLACES (never merges): merge is a conflict engine in disguise (§10);
  // replace makes the file an honest snapshot.
  // =========================================================
  function serializeAllData(){
    const data = {};
    Storage.keys().forEach(function(k){ if (k.indexOf("gtd_") === 0) data[k] = Storage.get(k); });
    return { app: "OELA", format: 1, exportedAt: new Date().toISOString(), data: data };
  }
  function exportAllData(){
    closeDialog();

    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "oela-backup-" + todayStr() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);

  function importError(msg){ openConfirmDialog(msg, [{ label: "OK", style: "primary", action: function(){} }]); }

    // that works in sandboxed contexts (unlike alert/confirm/prompt).
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json"; inp.style.display = "none";
    inp.addEventListener("change", function(){
      const file = inp.files && inp.files[0];
      inp.remove();
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(){
        let payload;
        try { payload = JSON.parse(reader.result); } catch (e){ importError("That file isn’t valid backup JSON."); return; }
        const data = payload && payload.data;
        if (!data || typeof data !== "object"){ importError("That file doesn’t look like an OELA backup."); return; }
        closeDialog();
        openConfirmDialog("This will replace everything currently in the app.", [
          { label: "Replace everything", style: "danger", action: function(){
              Storage.keys().forEach(function(k){ if (k.indexOf("gtd_") === 0) Storage.remove(k); });

  // =========================================================
  // CHUNK 6 (§4.9): Notes. A sixth lane (teal) for things that aren't actions

  function loadNotes(){ return Storage.getJSON("gtd_notes", []); }

  // deleted (found nowhere → tombstone, frozen denormalised name §4.9).
  function findProjectAnywhere(id){
    let p = state.tasks.current.find(function(t){ return t.id === id; }) || state.tasks.future.find(function(t){ return t.id === id; });
    if (p) return { task: p, state: "live" };
    p = (state.completed.current || []).find(function(t){ return t.id === id; }) || (state.completed.future || []).find(function(t){ return t.id === id; });

  function noteChipHtml(link, removable){

    const name = f ? f.task.title : (link.name || "a deleted project"); // live name refreshes; tombstone uses the frozen one

    '</span>';

  // Tag chips for a note (§4.9b). One flat visual — tags never carry the
  // live/completed/deleted states project chips do. A tagId with no surviving
  // registry entry is simply dropped (delete-a-tag is unlink, no tombstone).
  // On the note page chips are removable (draft ✕); on a card they filter.
  function noteTagChips(noteLike, removable){
    return ((noteLike && noteLike.tagIds) || []).map(function(id){
      const t = findTag(id);
      if (!t) return null;
      const filterAttr = (!removable) ? ' data-action="filter-notes" data-id="' + id + '"' : '';
      return '<span class="note-chip note-chip-tag"' + filterAttr + '>#' + escapeHtml(t.name) +

      '</span>';

  }
  // ---- Rich-text note body (§4.9, user: proper markup) --------------------
  // The body is HTML now, not plain text. It is authored in a contenteditable
  // and constrained to a small allowlist: emphasis (b/strong, i/em, u), one
  // heading level (h2), and lists (ul/ol/li), plus br and paragraph wrappers.
  // Everything else — scripts, styles, images, inline styles, links, spans,
  // colours, foreign tags pasted from other apps or arriving in an imported
  // backup (chunk 8) — is stripped. This is the ONE untrusted-input surface in
  // a local app, so sanitise on every save and defensively on render.
  const NOTE_ALLOWED_TAGS = { B:1, STRONG:1, I:1, EM:1, U:1, H2:1, UL:1, OL:1, LI:1, BR:1, P:1, DIV:1 };
  function sanitizeNoteHtml(html){
    const root = document.createElement("div");
    root.innerHTML = html || "";

        } else if (child.nodeType === 1 && NOTE_ALLOWED_TAGS[child.tagName]){

          // class="checked" on its <li>s. Values are whitelisted (not copied),

          // re-process the moved-up children starting from the first of them.

          node.removeChild(child);
          if (firstMoved) next = firstMoved;

  // "Empty" for placeholder purposes: no text AND no structural content. A

  function noteCardHtml(note){

    const allChips = (note.projectLinks || []).map(function(l){ return { html: noteChipHtml(l, false) }; })

  function renderNotesLane(laneEl){

  function openNoteScreen(noteId, opts){

  function noteToolbarHtml(){
    return '<div class="note-toolbar">' +

  }

  // sanitizeNoteHtml. H2 toggles back to a plain block when already a heading.
  // The UL/OL ancestor of the current selection, bounded to the editable.

    if (!sel || !sel.anchorNode) return null;

    while (n && n !== editable){

  function applyNoteFormat(cmd){
    const el = qs('.note-body[contenteditable]');

      else if (cmd === "italic") document.execCommand("italic");
      else if (cmd === "underline") document.execCommand("underline");
      else if (cmd === "ul") document.execCommand("insertUnorderedList");
      else if (cmd === "checklist"){

  function noteProjectPickerHtml(s){
    const linked = new Set((s.draft.projectLinks || []).map(function(l){ return l.id; }));

      .filter(function(t){ return !t.isGroup && !linked.has(t.id); });

      ? projects.map(function(p){ return '<button type="button" class="screen-hook-pick-item" data-action="note-pick-project" data-id="' + p.id + '">' + escapeHtml(p.title) + '</button>'; }).join("")
      : '<div class="empty-note">No projects to link yet — create one on the Projects tab.</div>';

      ? tags.map(function(t){ return '<button type="button" class="screen-hook-pick-item" data-action="note-pick-tag" data-id="' + t.id + '">#' + escapeHtml(t.name) + '</button>'; }).join("")
      : '<div class="empty-note">No tags yet — add some with “Manage tags”.</div>';

    return '<div class="screen-body pick-body">' +

      '<div class="screen-hook-pick-list">' + tagItems + '</div>' +
      '<div class="screen-hook-pick-label">Link a project</div>' +
      '<div class="screen-hook-pick-list">' + projItems + '</div>' +
      '<div class="screen-row" style="margin-top:10px; justify-content:space-between;">' +
        '<button type="button" class="btn btn-ghost btn-small" data-action="note-cancel-pick">Back</button>' +

  }
  function saveNoteScreen(s){

      const probe = document.createElement("div"); probe.innerHTML = sanitizeNoteHtml(s.draft.body || "");

  // =========================================================
  // TAGS PAGE (§4.9b). Reached from the badge → New tag (full manage mode)

  // tags are removed by the row ✕, which STAGES the removal — draft-isolated,

  // =========================================================
  function tagNorm(s){ return (s || "").trim().toLowerCase(); }
  function liveProjectTitles(){

  }
  function completedProjectTitles(){

  // ONE-WAY check (§4.9b): a tag is blocked by an existing tag row, a live

  // restorable → dashed + inline reason). Deleted projects are NOT checked
  // (their names are genuinely free). Returns null | "dup" | "completed".
  function tagNameCollision(name, selfIdx, rows){
    const n = tagNorm(name);

    for (let i = 0; i < rows.length; i++){ if (i !== selfIdx && tagNorm(rows[i].name) === n) return "dup"; }
    if (liveProjectTitles().some(function(t){ return tagNorm(t) === n; })) return "dup";
    if (completedProjectTitles().some(function(t){ return tagNorm(t) === n; })) return "completed";
    return null;

  function noteCountForTag(id){

  // draft. Existing tags show read-only (no rename/delete of shared state from
  // an open note draft); only NEW rows are addable. The note screen is stashed

  function openTagsScreen(createOnly){

  function tagsPageBodyHtml(s){

  function saveTagsScreen(s){
    const rows = s.draft.rows || [];
    // Validate every non-empty row; empties are simply dropped, no error.
    s.draft.rowErrors = {};
    let hasErr = false;
    rows.forEach(function(r, i){
      const name = (r.name || "").trim();

    });
    if (hasErr){ renderScreen(); return; }
    // Staged deletions = existing tags whose row is gone.
    const survivingIds = new Set(rows.filter(function(r){ return r.id; }).map(function(r){ return r.id; }));
    const deleted = (state.tags || []).filter(function(t){ return !survivingIds.has(t.id); });
    const inUse = deleted.filter(function(t){ return state.notes.some(function(n){ return (n.tagIds || []).indexOf(t.id) !== -1; }); });
    const commit = function(){

// =========================================================
// CALENDAR · EVENTS · RECURRENCE (chunk 7, spec.md §4.13–§4.15)
//
// An EVENT is a calendar entity that never lives in a lane (§4.13). It is
// created in the calendar, lives in gtd_events, and what appears in the
// lanes is a *view* of it: a bulleted widget at the top of Waiting (§4.13b)
// and, on its day, a PSEUDO-ACTION at the top of Next Actions (§4.14).
//
// Concatenated AFTER app.js in build.py, so every helper this module leans
// on (state, Storage, genId, escapeHtml, dateStrToDate, boundaryNow,
// openScreen, renderScreen, renderLane, saveTasksLocal, openConfirmDialog…)
// is a hoisted declaration in the same IIFE and resolves at call time. app.js
// likewise calls into the hoisted functions here (processEventBoundaries,
// openCalendarScreen, eventsHandleClick, saveEventScreen…).
//
// THE LOAD-BEARING INVARIANTS (each has a build-trap note in the spec):
//  · The pseudo-action's task ID is minted ON THE EVENT at creation, not at
//    first appearance (§4.14a) — event.taskId. This is what lets chunk 8 hook
//    a condition onto an event before its day with a plain task ID.
//  · The pseudo-action is a REAL stored row in state.tasks.next (drag pos,
//    context, completion), never a render-time projection (§4.14a).
//  · A recurring series is ONE live event that rolls forward — no spawning.
//    Its pseudo-action is REPLACED, not accumulated, and keeps the same task
//    ID across every roll (§4.15b, §4.14a).
// =========================================================

const RECUR_OPTIONS = [
  { v: "none", label: "Does not repeat" },
  { v: "daily", label: "Daily" },
  { v: "weekly", label: "Weekly" },
  { v: "monthly", label: "Monthly" },
  { v: "yearly", label: "Yearly" }
];
const RECUR_LABEL = { none: "Does not repeat", daily: "Daily", weekly: "Weekly", monthly: "Monthly", yearly: "Yearly" };
const CAL_UNDO_WINDOW_MS = 10 * 60 * 1000; // §4.15c: un-complete a series occurrence within 10 minutes

function loadEvents(){ return Storage.getJSON("gtd_events", null); }
function saveEvents(){ Storage.setJSON("gtd_events", state.events); }
function findEvent(id){ return (state.events || []).find(function(e){ return e.id === id; }) || null; }
function findEventByTaskId(taskId){ return (state.events || []).find(function(e){ return e.taskId === taskId; }) || null; }
function eventIsAppointment(ev){ return !!(ev && ev.time); }

// The clock, matching deadlineBarState() — real time plus the dev QA offset.
function nowInstant(){ return nowMs(); }

// The instant an occurrence "happens" (and, once past, goes overdue). A timed
// occurrence passes at its time; an UNTIMED one has no moment to converge on,
// so it passes at the 4 AM boundary that ENDS its app-day (§4.4d/§4.14c).
function occDueInstant(dateStr, timeStr){
  const d = dateStrToDate(dateStr);
  if (timeStr){ const p = timeStr.split(":").map(Number); d.setHours(p[0] || 0, p[1] || 0, 0, 0); return d.getTime(); }
  d.setHours(0, 0, 0, 0);
  return d.getTime() + 28 * 3600 * 1000; // next civil day, 4 AM
}
// The 4 AM boundary that BEGINS the app-day containing an occurrence — the
// pseudo-action's appearance moment and its progress-bar origin (§4.14b/c).
// Untimed occurrences are anchored at noon so the -4h shift can't drag them
// into the previous civil day (only 00:00–03:59 timed events do that, §4.14b).
function occAppearanceInstant(dateStr, timeStr){
  const d = dateStrToDate(dateStr);
  if (timeStr){ const p = timeStr.split(":").map(Number); d.setHours(p[0] || 0, p[1] || 0, 0, 0); }
  else d.setHours(12, 0, 0, 0);
  const shifted = new Date(d.getTime() - 4 * 3600 * 1000);
  return new Date(shifted.getFullYear(), shifted.getMonth(), shifted.getDate(), 4, 0, 0, 0).getTime();
}
function occAppearanceCivil(dateStr, timeStr){ return dateToStr(new Date(occAppearanceInstant(dateStr, timeStr))); }
function occPassed(dateStr, timeStr){ return nowInstant() >= occDueInstant(dateStr, timeStr); }

// Next occurrence of a recurrence rule from a given date. Interval (the
// "every N" advanced option, user ruling A1) defaults to 1. Weekly is a
// single weekday (the date's own) for the sprint — multi-weekday weekly is
// deferred and flagged in the handoff.
function nextOccurrenceDate(dateStr, recurrence, interval){
  const d = dateStrToDate(dateStr);
  const n = Math.max(1, interval || 1);
  if (recurrence === "daily") d.setDate(d.getDate() + n);
  else if (recurrence === "weekly") d.setDate(d.getDate() + 7 * n);
  else if (recurrence === "monthly") d.setMonth(d.getMonth() + n);
  else if (recurrence === "yearly") d.setFullYear(d.getFullYear() + n);
  else return null;
  return dateToStr(d);
}
// (prevOccurrenceDate lived here. Its only caller was occursOnCanonical's
// backward walk, which is exactly the bug in QA #1/#2 — a series never needs to
// look behind its live date. Deleted rather than left for someone to reuse.)
function isRecurring(ev){ return ev && ev.recurrence && ev.recurrence !== "none"; }

// The first occurrence of `ev` that has NOT yet passed, as a CANONICAL date —
// the occurrence a picker should offer you (QA #31). A one-shot has only its
// own date, so a passed one yields null. A recurring series is different: its
// live date is frequently already behind us (completed, hidden, or simply
// awaiting the 4 AM roll), and the thing you can still hook a Waiting action
// onto is the NEXT occurrence, not the one that is gone. Walking forward here
// is safe — unlike occursOnCanonical's deleted backward walk, this never
// invents an occurrence the series has already left behind.
function nextLiveOccurrenceDate(ev){
  if (!ev) return null;
  let d = ev.date, guard = 0;
  if (!occPassed(effDate(ev, d), effTime(ev, d))) return d;
  if (!isRecurring(ev)) return null;
  while (guard++ < 400){
    const nd = nextOccurrenceDate(d, ev.recurrence, ev.interval);
    if (!nd) return null;
    d = nd;
    if (!occPassed(effDate(ev, d), effTime(ev, d))) return d;
  }
  return null;
}

// =========================================================
// PER-OCCURRENCE OVERRIDES (user ruling #3: "edit particular events, not just
// series"). The one-live-entity model has no storage for a single overridden
// occurrence (§4.15b), so we add the smallest thing that does: an `overrides`
// map on the event, keyed by an occurrence's CANONICAL date (the date the pure
// recurrence rule lands it on — never moved). Each entry carries occurrence-
// level fields only: title, time, notesClean. Everything else (recurrence,
// interval, pause, context, project link, tickler) stays series-level.
// The EFFECTIVE value of an occurrence = the override for its date if present,
// else the series value. Scope is chosen at save via a dialog that mirrors the
// recurring-delete one. ⚑ Moving a single occurrence to a DIFFERENT day is out
// of scope (use "Skip this one", or edit the series) — flagged in the handoff.
// =========================================================
function occOverride(ev, canonicalDate){ return (ev && ev.overrides && ev.overrides[canonicalDate]) || null; }
function has(o, k){ return o && Object.prototype.hasOwnProperty.call(o, k); }
function effTitle(ev, d){ const o = occOverride(ev, d); return has(o, "title") ? o.title : ev.title; }
function effTime(ev, d){ const o = occOverride(ev, d); return has(o, "time") ? o.time : (ev.time || null); }
function effNotes(ev, d){ const o = occOverride(ev, d); return has(o, "notesClean") ? o.notesClean : (ev.notesClean || ""); }
// The occurrence's EFFECTIVE date — where it actually lands and displays. A
// single occurrence can be moved to a different day (override.date); the roll
// math and override key still use the CANONICAL date the rule produced.
function effDate(ev, canonicalDate){ const o = occOverride(ev, canonicalDate); return (o && o.date) ? o.date : canonicalDate; }
function daysBetween(a, b){ return Math.round((dateStrToDate(b).getTime() - dateStrToDate(a).getTime()) / 86400000); }
function addDaysStr(s, n){ return dateToStr(addDaysToDate(dateStrToDate(s), n)); }
// Which canonical occurrence(s) of `ev` display on `displayDate` (0, 1, or —
// if another occurrence was moved onto this day — more). Returns canonical
// dates, so callers can look up effective title/time/completion by key.
function canonicalsForDisplayDay(ev, displayDate){
  const out = [];
  // (a) the occurrence whose canonical date IS this day, unless it was moved away
  if (occursOnCanonical(ev, displayDate) && effDate(ev, displayDate) === displayDate) out.push(displayDate);
  // (b) any overridden occurrence moved ONTO this day from elsewhere
  if (ev.overrides){
    Object.keys(ev.overrides).forEach(function(c){
      if (c !== displayDate && ev.overrides[c] && ev.overrides[c].date === displayDate && occursOnCanonical(ev, c)) out.push(c);
    });
  }
  return out;
}
// After a roll, an override keyed to a now-past canonical date is dead weight.
function pruneOverrides(ev){
  if (!ev.overrides) return;
  Object.keys(ev.overrides).forEach(function(k){ if (k < ev.date) delete ev.overrides[k]; });
}

// §4.3b/§4.8b (chunk 7): a linked event/appointment is forward motion — a
// project planned around "act after the conference on the 14th" is NOT
// stalled. A recurring series always counts; a one-shot counts until it is
// completed (a long-past, done event no longer keeps a project alive).
function projectHasLinkedEvent(projectId){
  return (state.events || []).some(function(ev){
    if (ev.linkedProjectId !== projectId) return false;
    if (isRecurring(ev)) return true;
    return (ev.completedOccs || []).indexOf(ev.date) === -1;
  });
}

// =========================================================
// THE PSEUDO-ACTION (§4.14) — an event that displays as a Next Action.
// =========================================================
function isPseudoAction(task){ return !!(task && task.eventId); }

// The stored row. It carries the event's OWN occurrence date/time (occDate/
// occTime), independent of the live event.date, so it can sit in the lane as
// a past-due missed occurrence AFTER the series has already rolled its
// projection forward — and only flip to the new occurrence when that
// occurrence's app-day begins (§4.15b: "replaced at the 4 AM boundary of the
// next occurrence's app-day").
function makePseudoActionRow(ev){
  const c = ev.date; // canonical live occurrence (roll math + override key)
  return {
    id: ev.taskId, eventId: ev.id, isGroup: false, parent: null,
    title: effTitle(ev, c), notesClean: effNotes(ev, c),
    contextId: ev.contextId || null, linkedProjectId: ev.linkedProjectId || null,
    occCanon: c, occDate: effDate(ev, c), occTime: effTime(ev, c), // occDate = EFFECTIVE (where it lands)
    deadline: null, whenText: null, conditionId: null, conditionKind: null, conditionLabel: null,
    bundleText: null, createdAt: nowMs()
  };
}
function findPseudoRow(eventId){ return state.tasks.next.find(function(t){ return t.eventId === eventId; }) || null; }

// Drop a fresh pseudo-action at the top of its inherited context (or the top
// of the lane when it has none) — the §4.15b "lands at the top of that
// context" rule, reused for first appearance too.
function insertPseudoAtTop(row){
  const ctx = row.contextId;
  if (ctx){
    const idx = state.tasks.next.findIndex(function(t){ return !t.isGroup && t.contextId === ctx; });
    if (idx !== -1){ state.tasks.next.splice(idx, 0, row); return; }
  }
  state.tasks.next.unshift(row);
}

// The whole boundary sweep for events — mirrors processHabitBoundaries(), and
// like it is idempotent and safe to run on every boot/QA-jump. Returns true
// if anything changed (so the caller can persist + re-render).
function processEventBoundaries(){
  const today = todayStr();
  let changed = false;
  (state.events || []).forEach(function(ev){
    // A completed NON-recurring occurrence keeps its (dimmed) calendar mark
    // but has no live pseudo-action — nothing to sweep. A completed RECURRING
    // occurrence rolls once its 10-minute undo window closes (below).
    if (ev.paused){
      // Paused: stops rolling AND stops projecting (§4.15b). Any pseudo-action
      // already in the lane is left exactly where it is.
      return;
    }
    if (isRecurring(ev)){
      // (1) COMPLETION-DRIVEN roll: 10 minutes after the pseudo-action was
      //     completed, the series moves on (§4.15b/§4.15c). Before the window
      //     closes, un-completing rolls it back (restorePseudoAction).
      if (ev.completedAt != null && nowInstant() >= ev.completedAt + CAL_UNDO_WINDOW_MS){
        const nd = nextOccurrenceDate(ev.completedFrom || ev.date, ev.recurrence, ev.interval);
        if (nd){ ev.date = nd; }
        ev.completedAt = null; ev.completedFrom = null;
        changed = true;
      }
      // (2) PASS-DRIVEN roll: an uncompleted occurrence whose whole app-day is
      //     already behind us is a stale miss — advance the projection past it
      //     (one live entity, no accumulation). The occurrence whose app-day is
      //     TODAY stays put, even if its time already passed today, so a missed
      //     appointment still shows as past-due until tomorrow's boundary.
      let guard = 0;
      while (ev.completedAt == null && guard++ < 400){
        const appearCivil = occAppearanceCivil(ev.date, ev.time);
        if (appearCivil < today && occPassed(ev.date, ev.time)){
          // ⚑ Remember the miss before rolling past it (user ruling: "only keep
          // the most recent miss in the review").
          //
          // A one-shot that goes unticked keeps its pseudo-action and so reaches
          // the review on its own. A SERIES did not: rolling forward erased the
          // occurrence, so a standup you simply forgot to tick vanished at 4 AM
          // with no trace. The roll itself is right and stays — "one live
          // entity, no accumulation" is what stops a month of ignored dailies
          // becoming thirty review rows — so the miss is recorded beside the
          // series rather than by holding the series back.
          //
          // ONE slot, deliberately: a newer miss overwrites an older unhandled
          // one, which is exactly "most recent only". Rolling past several in a
          // single sweep therefore leaves the LAST one, the one still worth
          // asking about.
          if ((ev.completedOccs || []).indexOf(ev.date) === -1){
            ev.missedOcc = ev.date;
          }
          const nd = nextOccurrenceDate(ev.date, ev.recurrence, ev.interval);
          if (!nd) break;
          ev.date = nd; changed = true;
        } else break;
      }
      pruneOverrides(ev); // drop overrides for occurrences the series has passed
    }
    // (3) APPEARANCE / REPLACEMENT. Timing keys off the occurrence's EFFECTIVE
    //     date/time — a single occurrence moved to another day appears on that
    //     day instead. Once its app-day has begun, ensure exactly one pseudo-
    //     action exists; a row still showing an earlier occurrence is REPLACED
    //     IN PLACE (same task ID, inherited context, top of context — §4.15b).
    if (ev.completedAt != null) return; // completed occurrence: no live row until it rolls
    // A COMPLETED occurrence has no live row (§4.14a). A recurring series is
    // held here by completedAt until its roll — but a ONE-SHOT never sets
    // completedAt, so without this check the sweep re-mints its pseudo-action
    // on every boot/QA-jump: a long-done event walks back into Next Actions,
    // arriving with a full red "passed" bar because its occDate is in the past.
    // Keyed by CANONICAL date, the same key completedOccs is written with.
    const doneOccs = ev.completedOccs || [];
    if (doneOccs.indexOf(ev.date) !== -1){
      // Heal state already corrupted by the above: a row for an occurrence
      // that is recorded complete is a ghost — drop it. (Idempotent, like the
      // rest of the sweep, so it self-repairs on the next boot.)
      const ghost = findPseudoRow(ev.id);
      if (ghost && doneOccs.indexOf(ghost.occCanon) !== -1){
        state.tasks.next = state.tasks.next.filter(function(t){ return t.id !== ghost.id; });
        changed = true;
      }
      return;
    }
    const eff = effDate(ev, ev.date), effT = effTime(ev, ev.date);
    const appearCivil = occAppearanceCivil(eff, effT);
    const row = findPseudoRow(ev.id);
    if (today < appearCivil){
      // Not its day yet. If a row for THIS canonical occurrence is sitting in
      // the lane — because the user just MOVED the live occurrence into the
      // future — retire it; it will re-appear on the moved day. (A past-due row
      // from an already-rolled occurrence has occCanon < ev.date and is left.)
      if (row && row.occCanon === ev.date){ state.tasks.next = state.tasks.next.filter(function(t){ return t.id !== row.id; }); changed = true; }
      return;
    }
    if (!row){
      insertPseudoAtTop(makePseudoActionRow(ev));
      changed = true;
    } else if (row.occCanon !== ev.date){
      // Rolled to a new occurrence — replace in place, inheriting context.
      row.occCanon = ev.date; row.occDate = eff; row.occTime = effT;
      row.title = effTitle(ev, ev.date); row.notesClean = effNotes(ev, ev.date);
      row.linkedProjectId = ev.linkedProjectId || null;
      if (row.contextId && !findContext(row.contextId)) row.contextId = null; // §7 EMERGENCY RULE
      state.tasks.next = state.tasks.next.filter(function(t){ return t.id !== row.id; });
      insertPseudoAtTop(row);
      changed = true;
    } else {
      // Same occurrence still live: keep drag position, refresh effective fields
      // (a time/title/date override or a series edit may have changed them).
      const nt = effTitle(ev, ev.date), nn = effNotes(ev, ev.date);
      if (row.occDate !== eff || row.occTime !== effT || row.title !== nt || row.notesClean !== nn){
        row.occDate = eff; row.occTime = effT; row.title = nt; row.notesClean = nn; changed = true;
      }
    }
  });
  if (changed){ saveTasksLocal("next"); saveEvents(); } // rolls/clears mutate BOTH stores
  return changed;
}

// Completing a pseudo-action (from the lane checkbox, its event page, or the
// review) archives the card like any Next Action AND writes back to the event
// (§4.14a). For a recurring series this arms the 10-minute roll; for a
// one-shot it just records the completed occurrence (kept, dimmed, on the
// calendar — user ruling #6). Called from completeTask() after it archives.
function onPseudoActionCompleted(task){
  const ev = findEvent(task.eventId);
  if (!ev) return;
  const occ = task.occCanon || ev.date; // completion is tracked by CANONICAL date (roll math)
  ev.completedOccs = ev.completedOccs || [];
  if (ev.completedOccs.indexOf(occ) === -1) ev.completedOccs.push(occ);
  if (isRecurring(ev)){
    ev.completedAt = nowInstant();
    ev.completedFrom = occ;
  }
  saveEvents();
}
// Un-completing (restoreTask) within the 10-minute window rolls a series back
// and returns the pseudo-action; outside it, the archive entry stands and the
// series has moved on (§4.15c). Called from restoreTask BEFORE it unshifts the
// row back into the lane; returns true if the restore should proceed normally.
function onPseudoActionRestored(task){
  const ev = findEventByTaskId(task.id) || findEvent(task.eventId);
  if (!ev) return true; // event deleted meanwhile: restore as a plain orphaned row
  const occ = task.occCanon || task.occDate || ev.date;
  if (isRecurring(ev)){
    // Inside the 10-minute window (§4.15c): roll the series back and let the
    // pseudo-action return. Outside it: the archive entry stands and the series
    // has moved on — REFUSE the restore so it can't duplicate the rolled row.
    if (ev.completedAt != null && nowInstant() < ev.completedAt + CAL_UNDO_WINDOW_MS){
      ev.completedAt = null; ev.completedFrom = null;
    } else {
      return false;
    }
  }
  // A live row with this task ID would collide (belt-and-braces).
  if (findPseudoRow(ev.id) && findPseudoRow(ev.id).id === task.id) return false;
  ev.completedOccs = (ev.completedOccs || []).filter(function(d){ return d !== occ; });
  saveEvents();
  return true;
}

// =========================================================
// THE PSEUDO-ACTION PROGRESS BAR (§4.14c / §4.4d).
//
// ONE RULE, both shapes: the bar starts EMPTY at the moment the pseudo-action
// appears — the 4 AM boundary beginning its app-day — and fills linearly to the
// moment the occurrence happens. Red in the final 15%, passed after.
//   · Appointment (timed): 4 AM → the time.
//   · Untimed event:       4 AM → the 4 AM that ENDS the app-day (a flat 24h),
//                          so it reaches full exactly as it goes past-due.
//
// ⚑ CORRECTED (user, this round): the untimed case used to return a FULL bar
// for the whole day, on a "Full ≠ late" reading recorded in §4.4d/§4.14c as a
// user ruling. That was a miscommunication — the actual ruling is the one above
// (the bar begins when the row appears), and a bar that is full from the moment
// you first see it carries no information. spec.md §4.4d/§4.14c updated to match.
// =========================================================
function pseudoBarState(dateStr, timeStr){
  const now = nowInstant();
  const due = occDueInstant(dateStr, timeStr);
  if (now >= due) return { full: true, red: true, passed: true, fillPercent: 100 };
  const origin = occAppearanceInstant(dateStr, timeStr);
  const total = due - origin;
  if (total <= 0) return { full: true, red: false, passed: false, fillPercent: 100 };
  const frac = Math.max(0, Math.min(1, (now - origin) / total));
  return { full: false, red: frac >= 0.85, passed: false, fillPercent: Math.round(frac * 100) };
}
function pseudoBarHtml(task){
  const s = pseudoBarState(task.occDate, task.occTime);
  const classes = "deadline-bar" + (s.full ? " full" : "") + (s.red ? " red" : "") + (s.passed ? " passed" : "");
  // An event has no push counter (recurrence is its own thing), but it uses the
  // same chip wrapper so there is one positioning system, not two.
  const chip = s.passed ? '<span class="deadline-chips"><span class="deadline-passed-chip">passed</span></span>' : "";
  return '<div class="' + classes + '" style="--fill:' + s.fillPercent + '%"><div class="deadline-bar-fill"></div>' + chip + '</div>';
}
// Is this pseudo-action past-due? Used by the review's past-due kind (§4.8b,
// pseudo-action shape) — mirrors deadlineBarState().passed for real deadlines.
function pseudoPassed(task){ return pseudoBarState(task.occDate, task.occTime).passed; }

// (pseudoDescriptor lived here — it returned "appointment" or "event" for the
// text in front of a date. Its callers were removed in the jargon pass that took
// out "adding a time makes it an appointment"; the function outlived them as
// dead code. Deleted rather than left for someone to wire back up: the user's
// ruling is that the distinction is real but carries no information a reader
// needs, so it belongs on a label at most, never in a sentence.)

// =========================================================
// DUPLICATE-TITLE SCOPE FOR EVENTS (§7). An event is not in a lane, so
// "per-lane" doesn't define its scope: check gtd_events AND the Next Actions
// lane, because on its day the event mints a pseudo-action THERE, through a
// 4 AM sweep no save-time check can intercept. Prevent where it is cheap.
// =========================================================
function eventTitleClashes(title, exceptEventId){
  const n = (title || "").trim().toLowerCase();
  if (!n) return false;
  const inEvents = (state.events || []).some(function(e){
    return e.id !== exceptEventId && (e.title || "").trim().toLowerCase() === n;
  });
  if (inEvents) return true;
  return state.tasks.next.some(function(t){
    // Skip the event's own pseudo-action — it legitimately shares the title.
    if (t.isGroup || (t.eventId && t.eventId === exceptEventId)) return false;
    return (t.title || "").trim().toLowerCase() === n;
  });
}

// =========================================================
// THE WAITING-LANE WIDGET (§4.13b) — a yellow-bordered box atop Waiting with a
// bulleted list of events/appointments within 7 days. Not interactive beyond
// opening the calendar. Ticklers are excluded (user addition: set-and-forget
// reminders stay off the calendar list until their day).
// =========================================================
function upcomingWidgetEvents(){
  const today = todayStr();
  const horizon = dateToStr(addDaysToDate(dateStrToDate(today), 7));
  const out = [];
  (state.events || []).forEach(function(ev){
    if (ev.tickler || ev.paused) return;
    // The live occurrence, plus any projected recurrences, that fall in-window
    // by their EFFECTIVE date (a moved occurrence rides on its new day). Walk a
    // few canonical steps past the horizon so a moved-earlier occurrence isn't
    // missed.
    let d = ev.date, guard = 0;
    while (guard++ < 70){
      const e = effDate(ev, d);
      if (d > horizon && e > horizon) break;
      if (e >= today && e <= horizon) out.push({ date: e, time: effTime(ev, d), title: effTitle(ev, d) });
      if (!isRecurring(ev)) break;
      const nd = nextOccurrenceDate(d, ev.recurrence, ev.interval);
      if (!nd || nd <= d) break;
      d = nd;
    }
  });
  out.sort(function(a, b){ return (a.date + (a.time || "99:99")).localeCompare(b.date + (b.time || "99:99")); });
  return out.slice(0, 8);
}
function waitingWidgetHtml(){
  const items = upcomingWidgetEvents();
  const bullets = items.length
    ? items.map(function(it){
        const d = dateStrToDate(it.date);
        const ds = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
        const when = it.time ? ds + " · " + it.time : ds;
        return '<li><span class="cal-widget-when">' + escapeHtml(when) + '</span> ' + escapeHtml(it.title) + '</li>';
      }).join("")
    : '<li class="cal-widget-empty">Nothing in the next 7 days.</li>';
  return (
    '<div class="cal-widget" data-action="open-calendar" title="Open the calendar">' +
      '<div class="cal-widget-icon">&#128197;</div>' +
      '<ul class="cal-widget-list">' + bullets + '</ul>' +
    '</div>'
  );
}

// Collapse repeated completions of one recurring series into a single row
// (§4.15b: "Pay rent ×6"). Order-preserving: only items with a truthy seriesId
// fold together (at their most-recent occurrence); everything else stays a
// singleton, so plain completed actions are untouched.
function collapseCompletedSeries(items){
  const out = [];
  const bySeries = {};
  (items || []).forEach(function(t){
    if (t.seriesId && bySeries[t.seriesId]){ bySeries[t.seriesId].count++; return; }
    const entry = { task: t, count: 1 };
    if (t.seriesId) bySeries[t.seriesId] = entry;
    out.push(entry);
  });
  return out;
}

// Linked-event rows for a project page (§4.15d) — displays-as-an-action,
// nearest→farthest. Tapping opens the event page as a child screen.
function projectLinkedEventRowsHtml(projectId){
  if (!projectId) return "";
  const evs = (state.events || []).filter(function(ev){ return ev.linkedProjectId === projectId; });
  if (!evs.length) return "";
  // Show the live occurrence at its EFFECTIVE date/time (a moved one included).
  evs.sort(function(a, b){ return (effDate(a, a.date) + (effTime(a, a.date) || "99:99")).localeCompare(effDate(b, b.date) + (effTime(b, b.date) || "99:99")); });
  return evs.map(function(ev){
    const d = dateStrToDate(effDate(ev, ev.date));
    const when = d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + (effTime(ev, ev.date) ? " · " + effTime(ev, ev.date) : "");
    let row = '<button type="button" class="linked-action-item" data-action="open-event" data-id="' + ev.id + '">' +
      '<span class="kind-dot kind-event" aria-hidden="true"></span>' + escapeHtml(effTitle(ev, ev.date)) +
      ' <span class="cal-agenda-kind">' + escapeHtml(when) + '</span></button>';
    // §4.15d: a Waiting action hooked to this linked event nests beneath it,
    // the same as one hooked to a linked action (chunk 8 event-conditioning).
    state.tasks.waiting.forEach(function(t){

      row += '<button type="button" class="linked-action-item indented" data-action="open-edit" data-kind="waiting" data-id="' + t.id + '">' +
        '<span class="kind-dot kind-waiting" aria-hidden="true"></span>' + escapeHtml(t.title) + '</button>';
    });
    return row;
  }).join("");
}
