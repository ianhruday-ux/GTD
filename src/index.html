<!DOCTYPE html>
<!--
  GTD CONSOLE
  ===========
  This app works completely on its own — it stores everything in this
  browser's local storage, needs no setup, and you can hand this single file
  to anyone and it'll just work.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OELA — Over-Engineered List App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#171513">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
<!--BUILD:STYLES-->
</style>
</head>
<body>

<header>
  <div class="brand"><span class="mark">OELA</span></div>
  <div class="header-right">
    <button class="header-icon" type="button" title="Intray" data-action="open-tray">&#128229;</button>
    <button class="header-icon" type="button" title="Calendar" data-action="open-calendar">&#128197;</button>
    <button class="header-icon" type="button" title="More" data-action="open-overflow">&#8943;</button>
  </div>
</header>

<!-- Compact letter+icon panels, no horizontal scroll (user round). Related
     lanes share one panel, split into two independently-tappable halves --
     Next/Waiting and Projects/Someday. Habits stands alone for now; its
     natural partner is Notes, which has no lane yet (chunk 6) -- when it
     lands, Habits pairs with it the same way. tab-name is kept (visually
     hidden) for accessibility -- the letter+icon are decorative shorthand,
     not the accessible label. -->
<nav class="tabbar" id="lane-switcher" role="tablist">
  <div class="tab-pair">
    <button class="tab active" data-kind="next"><span class="tab-letter">N</span><span class="tab-icon">&#9889;</span><span class="tab-count">0</span><span class="tab-name">Next Actions</span></button>
    <button class="tab" data-kind="waiting"><span class="tab-letter">W</span><span class="tab-icon">&#9203;</span><span class="tab-count">0</span><span class="tab-name">Waiting On</span></button>
  </div>
  <div class="tab-pair">
    <button class="tab" data-kind="current"><span class="tab-letter">P</span><span class="tab-icon">&#128296;</span><span class="tab-count">0</span><span class="tab-name">Projects</span></button>
    <button class="tab" data-kind="future"><span class="tab-letter">S</span><span class="tab-icon">&#128301;</span><span class="tab-count">0</span><span class="tab-name">Someday</span></button>
  </div>
  <div class="tab-pair">
    <button class="tab" data-kind="habit"><span class="tab-letter">H</span><span class="tab-icon">&#127937;</span><span class="tab-count">0</span><span class="tab-name">Habits</span></button>
    <button class="tab" data-kind="notes"><span class="tab-letter">✎</span><span class="tab-icon">&#128221;</span><span class="tab-count">0</span><span class="tab-name">Notes</span></button>
  </div>
</nav>
<div class="tabbar-spacer" aria-hidden="true"></div>

<!-- Dev-only scaffolding — not part of the app's designed surface. Scrolls
     with content instead of living in the fixed chrome above, which is
     reserved for the real header (chunk 2, §4.10). -->
<div id="dev-toolbar">
  <button class="btn btn-ghost btn-small" id="reset-btn">Reset local data</button>
  <button class="btn btn-ghost btn-small" id="qa-day-btn" title="Dev QA aid: advances the app's clock by one day and re-runs habit boundary processing, so multi-day habit logic (stumbles, misses, run-ending, badges) can be tested without waiting">QA: +1 Day</button>
  <button class="btn btn-ghost btn-small" id="qa-hour-btn" title="Dev QA aid: advances the app's clock by one hour and re-runs habit boundary processing">QA: +1 Hr</button>
  <button class="btn btn-ghost btn-small" id="qa-min-btn" title="Dev QA aid: advances the app's clock by fifteen minutes and re-runs habit boundary processing — fine-grained enough to step through the midnight-4am window where the calendar date and the app's day boundary deliberately disagree">QA: +15 Min</button>
  <span class="qa-time-readout" id="qa-time-readout" title="What the app currently thinks &lsquo;now&rsquo; is, after any QA time jumps"></span>
  <button class="btn btn-ghost btn-small" id="qa-snapshot-btn" title="Dev QA aid: saves all current data to one snapshot slot (survives Reset), so you can try something destructive and get back to exactly this state">Snapshot</button>
  <button class="btn btn-ghost btn-small" id="qa-restore-btn" title="Dev QA aid: replaces all current data with the last snapshot, then reloads">Restore</button>
  <button class="btn btn-ghost btn-small" id="drag-log-toggle" title="Dev: record the press-and-hold drag lifecycle so a phone-only drag bug can be reported as copyable text">Drag log: off</button>
  <button class="btn btn-ghost btn-small" id="drag-log-show" title="Dev: show the recorded drag log to copy or screenshot">Show drag log</button>
</div>
<div id="drag-log-panel" hidden>
  <textarea id="drag-log-text" readonly rows="12" placeholder="Turn the drag log ON, reproduce the bug, then tap Show drag log."></textarea>
  <div class="drag-log-actions">
    <button class="btn btn-ghost btn-small" id="drag-log-copy">Copy</button>
    <button class="btn btn-ghost btn-small" id="drag-log-clear">Clear</button>
    <button class="btn btn-ghost btn-small" id="drag-log-close">Close</button>
  </div>
</div>

<main id="main">
  <div class="lanes" id="lanes"></div>
</main>

<footer id="footer-note">Data lives in this browser's local storage.</footer>

<div id="tray-root"></div>
<div id="screen-root"></div>
<div id="dialog-root"></div>
<button id="fab-create" type="button" title="Create" data-action="fab" data-kind="next">+</button>
<div class="fab-menu" id="fab-menu" hidden>
  <button type="button" class="fab-menu-item" data-action="new-primary">New action</button>
  <button type="button" class="fab-menu-item" data-action="new-secondary">New context</button>
  <button type="button" class="fab-menu-item" data-action="new-tertiary" hidden>New tag</button>
</div>

<script>
<!--BUILD:SCRIPT-->
</script>
</body>
</html>
